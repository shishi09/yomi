<!DOCTYPE html>
<html lang="fr" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yomi</title>
<style>
  :root {
    --sidebar-bg: #201D18;
    --sidebar-border: rgba(246, 212, 139, 0.14);
    --content-bg: #191714;
    --card-bg: #26221C;
    --card-border: rgba(246, 212, 139, 0.14);
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.34);
    --mascot-glow: rgba(242, 202, 116, 0.08);
    --row-sep: rgba(246, 212, 139, 0.10);
    --text: #F6EFE2;
    --ink: #F6EFE2;
    --muted: #A99D8E;
    --accent: #F2CA74;
    --accent-hover: #E5B758;
    --accent-border: #D9A94E;
    --accent-soft: rgba(242, 202, 116, 0.18);
    --accent-text: #F2CA74;
    --on-accent: #1D1814;
    --sand: #2E2922;
    --sand-strong: rgba(242, 202, 116, 0.22);
    --pill-bg: #312B23;
    --pill-border: rgba(246, 212, 139, 0.18);
    --pill-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    --pill-hover: #3C352B;
    --input-bg: #161411;
    --green: #7FB069;
    --green-soft: rgba(127, 176, 105, 0.16);
    --warn: #E8A849;
    --warn-soft: rgba(232, 168, 73, 0.18);
    --red: #E56B63;
    --red-soft: rgba(229, 107, 99, 0.18);
    --switch-off: #3E3931;
    --prog-track: rgba(246, 212, 139, 0.12);
    --kbd-bg: rgba(246, 212, 139, 0.10);
    --scenic-sky: #211E19;
    --scenic-mt-1: rgba(246, 239, 226, 0.07);
    --scenic-mt-2: rgba(246, 239, 226, 0.12);
    --scenic-pagoda: rgba(246, 239, 226, 0.18);
    --scenic-petal: #E4BD6B;
    --scenic-branch: rgba(246, 239, 226, 0.26);
  }
  :root[data-mascot="kuro"] { --mascot-glow: rgba(242, 202, 116, 0.08); }
  :root[data-mascot="sakura"] { --mascot-glow: rgba(244, 175, 160, 0.10); }
  :root[data-theme="light"] {
    --sidebar-bg: #F4EBDA;
    --sidebar-border: #E6DAC4;
    --content-bg: #FAF5EA;
    --card-bg: #FCF8F0;
    --card-border: #E6DAC4;
    --card-shadow: 0 4px 18px rgba(74, 58, 35, 0.055);
    --mascot-glow: rgba(245, 206, 117, 0.14);
    --row-sep: rgba(35, 30, 26, 0.07);
    --text: #231E1A;
    --ink: #231E1A;
    --muted: #786D61;
    --accent: #F5CE75;
    --accent-hover: #EBB852;
    --accent-border: #E0B55A;
    --accent-soft: #FBEAC2;
    --accent-text: #B88324;
    --on-accent: #231E1A;
    --sand: #F4E9D3;
    --sand-strong: #F9E4B3;
    --pill-bg: #FCF8F0;
    --pill-border: #DFD2BA;
    --pill-shadow: 0 1px 3px rgba(74, 58, 35, 0.06);
    --pill-hover: #F5EEDD;
    --input-bg: #FFFDF8;
    --green: #4F7F3B;
    --green-soft: #E6EEDB;
    --warn: #A86416;
    --warn-soft: rgba(245, 179, 66, 0.22);
    --red: #B83A32;
    --red-soft: rgba(184, 58, 50, 0.12);
    --switch-off: #D9CDB8;
    --prog-track: rgba(35, 30, 26, 0.09);
    --kbd-bg: #F2E8D5;
    --scenic-sky: #F6EFE0;
    --scenic-mt-1: #EAE0CC;
    --scenic-mt-2: #DFD2BA;
    --scenic-pagoda: #B8AA93;
    --scenic-petal: #EFC36A;
    --scenic-branch: #8E7B64;
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
      --sidebar-bg: #F4EBDA;
      --sidebar-border: #E6DAC4;
      --content-bg: #FAF5EA;
      --card-bg: #FCF8F0;
      --card-border: #E6DAC4;
      --card-shadow: 0 4px 18px rgba(74, 58, 35, 0.055);
      --mascot-glow: rgba(245, 206, 117, 0.14);
      --row-sep: rgba(35, 30, 26, 0.07);
      --text: #231E1A;
      --ink: #231E1A;
      --muted: #786D61;
      --accent: #F5CE75;
      --accent-hover: #EBB852;
      --accent-border: #E0B55A;
      --accent-soft: #FBEAC2;
      --accent-text: #B88324;
      --on-accent: #231E1A;
      --sand: #F4E9D3;
      --sand-strong: #F9E4B3;
      --pill-bg: #FCF8F0;
      --pill-border: #DFD2BA;
      --pill-shadow: 0 1px 3px rgba(74, 58, 35, 0.06);
      --pill-hover: #F5EEDD;
      --input-bg: #FFFDF8;
      --green: #4F7F3B;
      --green-soft: #E6EEDB;
      --warn: #A86416;
      --warn-soft: rgba(245, 179, 66, 0.22);
      --red: #B83A32;
      --red-soft: rgba(184, 58, 50, 0.12);
      --switch-off: #D9CDB8;
      --prog-track: rgba(35, 30, 26, 0.09);
      --kbd-bg: #F2E8D5;
      --scenic-sky: #F6EFE0;
      --scenic-mt-1: #EAE0CC;
      --scenic-mt-2: #DFD2BA;
      --scenic-pagoda: #B8AA93;
      --scenic-petal: #EFC36A;
      --scenic-branch: #8E7B64;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: clamp(13px, 0.95vw, 15.5px); line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
  }

  .app-layout { display: flex; width: 100%; height: 100vh; background: transparent; }

  /* PERSISTENT LEFT SIDEBAR (Yomi Washi) */
  .sidebar {
    width: clamp(176px, 16vw, 212px); flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    padding: 46px 14px 16px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .sidebar.hidden { display: none; }
  .sidebar-brand {
    border: none; background: transparent; color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 4px 8px 18px; margin-bottom: 6px;
    cursor: pointer; font-family: inherit;
    transition: transform 0.14s ease;
  }
  .sidebar-brand:hover { transform: translateY(-1px); }
  .sidebar-brand-cat {
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sidebar-brand-cat svg {
    width: 44px; height: 40px; display: block; image-rendering: pixelated;
    filter: drop-shadow(0 3px 6px rgba(35, 30, 26, 0.14));
  }
  .sidebar-brand-name {
    font-size: 20px; font-weight: 800; letter-spacing: -0.025em; color: var(--text);
  }
  .nav-list {
    display: flex; flex-direction: column; gap: 4px; flex: 1;
    overflow-y: auto; position: relative; z-index: 1;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 12px; border-radius: 12px;
    border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    cursor: pointer; text-align: left; width: 100%;
    transition: background 0.14s, color 0.14s;
  }
  .nav-item:hover:not(.active) { background: var(--accent-soft); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--text); opacity: 0.78; }
  .nav-item span.lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item.active {
    background: var(--sand-strong); color: var(--ink); font-weight: 650;
    box-shadow: inset 0 0 0 1px var(--accent-soft);
  }
  .nav-item.active svg { color: var(--ink); opacity: 1; }
  .sidebar-decor {
    position: absolute; left: 0; right: 0; bottom: 42px;
    pointer-events: none; z-index: 0; line-height: 0;
  }
  .sidebar-decor svg { width: 100%; height: auto; display: block; }
  .sidebar-footer {
    position: relative; z-index: 1;
    margin-top: auto; padding-top: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-theme-switch {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px; border-radius: 999px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    box-shadow: var(--pill-shadow);
  }
  .sidebar-theme-btn {
    width: 30px; height: 26px; border: none; border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    transition: background 0.14s, color 0.14s;
  }
  .sidebar-theme-btn svg { width: 14px; height: 14px; }
  .sidebar-theme-btn:hover:not(.on) { color: var(--text); }
  .sidebar-theme-btn.on { background: var(--sand-strong); color: var(--ink); }
  .sidebar-theme-div { width: 1px; height: 14px; background: var(--card-border); }

  .app-layout.is-fullscreen .sidebar {
    padding-top: 20px;
    width: clamp(204px, 15vw, 250px);
  }

  /* MAIN PANE */
  .main-pane {
    flex: 1; min-width: 0;
    background: radial-gradient(circle at 60% 18%, var(--mascot-glow), transparent 62%), var(--content-bg);
    display: flex; flex-direction: column; height: 100vh;
  }
  .main-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(12px, 1.8vh, 18px) clamp(22px, 2.6vw, 34px) clamp(6px, 1vh, 10px);
    min-height: 46px; flex-shrink: 0; gap: 12px;
  }
  .main-pane.is-fullscreen .main-header {
    padding: 16px clamp(24px, 3vw, 48px) 8px;
  }
  .main-pane.wiz-mode .main-header { padding-left: 88px; min-height: 48px; }
  .main-pane.wiz-mode.is-fullscreen .main-header { padding-left: clamp(24px, 3vw, 48px); }
  .main-pane.home-mode .main-header { display: none; }
  .main-title {
    margin: 0; font-size: clamp(16px, 1.3vw, 20px); font-weight: 700; letter-spacing: -0.02em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .main-pane.wiz-mode .main-title {
    font-size: clamp(13px, 1vw, 15px); font-weight: 600; color: var(--muted); letter-spacing: 0;
  }
  .title-cat {
    display: inline-flex; align-items: center; justify-content: center;
  }
  .title-cat svg {
    width: 20px; height: 18px; display: block; image-rendering: pixelated;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* HEADER SEG FR/EN IN WIZARD */
  .lang-seg {
    display: inline-flex; padding: 2px; border-radius: 999px;
    background: var(--kbd-bg); border: 1px solid var(--card-border);
  }
  .lang-seg button {
    border: none; background: transparent; color: var(--muted);
    font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; cursor: pointer;
  }
  .lang-seg button.on {
    background: var(--pill-bg); color: var(--text); box-shadow: var(--pill-shadow);
  }

  .main-scroll {
    flex: 1; overflow-y: auto; padding: 4px clamp(20px, 2.8vw, 44px) clamp(18px, 2.5vh, 30px);
  }
  .main-pane.wiz-mode .main-scroll {
    padding: clamp(8px, 2vh, 24px) clamp(20px, 3vw, 48px);
    display: flex; flex-direction: column;
  }
  .main-pane.home-mode .main-scroll {
    padding: clamp(22px, 3vh, 36px) clamp(20px, 3vw, 48px) clamp(18px, 2.5vh, 30px);
    display: flex; flex-direction: column;
  }
  .main-pane.home-mode.is-fullscreen .main-scroll {
    padding: clamp(22px, 2.8vh, 36px) clamp(24px, 3vw, 48px) clamp(22px, 2.8vh, 36px);
  }
  .main-pane.test-mode .main-scroll {
    padding: 4px clamp(16px, 2.2vw, 32px) clamp(14px, 2vh, 22px);
    display: flex; flex-direction: column;
  }
  .main-pane.is-fullscreen .main-scroll {
    padding-left: clamp(24px, 3vw, 48px);
    padding-right: clamp(24px, 3vw, 48px);
  }
  .settings-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  .main-pane.is-fullscreen .settings-wrap { max-width: none; width: 100%; }
  .page-subtitle {
    margin: 0 0 14px; font-size: clamp(12.5px, 1.05vw, 15px); color: var(--muted);
  }

  /* PIXEL ART CAT MASCOT + WALKING ARENA */
  .cat-stage {
    position: relative; display: inline-flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4px 10px 2px; border-radius: 18px;
    background: transparent; border: none; cursor: pointer;
  }
  .cat-arena {
    position: relative;
    width: clamp(138px, 14vw, 196px);
    height: clamp(86px, 8.8vw, 126px);
    display: flex; align-items: center; justify-content: center;
  }
  .cat-card .cat-arena {
    width: 100%;
    height: clamp(72px, 7.2vw, 104px);
  }
  .cat-glow {
    position: absolute; width: 78%; height: 78%; border-radius: 999px;
    filter: blur(18px); pointer-events: none; transition: background 0.25s ease, opacity 0.25s ease;
  }
  .cat-glow.on { background: rgba(245, 206, 117, 0.34); opacity: 1; }
  .cat-glow.off { background: var(--accent-soft); opacity: 0.65; }
  .cat-rug {
    position: absolute; bottom: 8%; width: 64%; height: 16%;
    border-radius: 999px; background: rgba(128, 128, 128, 0.10);
    pointer-events: none;
  }
  .cat-walker {
    position: relative; display: flex; flex-direction: column; align-items: center;
    transition: transform 0.11s linear; will-change: transform;
  }
  .cat-halo {
    position: relative;
    width: clamp(72px, 7vw, 110px); height: clamp(64px, 6.2vw, 98px);
    display: flex; align-items: center; justify-content: center;
  }
  .cat-svg {
    width: clamp(64px, 6.4vw, 100px); height: clamp(56px, 5.6vw, 88px);
    display: block; image-rendering: pixelated;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.18));
  }
  :root[data-theme="dark"] .cat-svg {
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.28)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.30));
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] .cat-svg {
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.28)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.30));
    }
  }
  .cat-shadow {
    width: clamp(44px, 4.4vw, 68px); height: 7px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.16); margin-top: -2px;
  }
  :root[data-theme="light"] .cat-shadow { background: rgba(15, 23, 42, 0.10); }
  .cat-particles {
    position: absolute; inset: 0; pointer-events: none; overflow: visible;
  }
  .cat-bubble {
    position: absolute; top: 0; right: 2px; z-index: 2;
    padding: 3px 9px; border-radius: 999px;
    background: var(--pill-bg); color: var(--text);
    border: 1px solid var(--pill-border); box-shadow: var(--pill-shadow);
    font-size: 10.5px; font-weight: 600; white-space: nowrap;
    opacity: 0; transform: translateY(4px) scale(0.94);
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  .cat-stage:hover .cat-bubble,
  .cat-bubble.show {
    opacity: 1; transform: translateY(0) scale(1);
  }
  .cat-z {
    position: absolute; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 800; color: var(--accent-text); opacity: 0;
    animation: catFloatZ 2.6s ease-in-out infinite;
  }
  .cat-z.z1 { right: 4px; top: 14px; font-size: 10px; animation-delay: 0s; }
  .cat-z.z2 { right: -2px; top: 4px; font-size: 12px; animation-delay: 0.75s; }
  .cat-z.z3 { right: 8px; top: -6px; font-size: 14px; animation-delay: 1.5s; }
  .cat-heart {
    position: absolute; left: 50%; top: -4px; transform: translateX(-50%);
    font-size: 13px; color: #ff4f7a; animation: catPop 1.0s ease-in-out infinite;
  }
  .cat-star {
    position: absolute; font-size: 11px; color: #ff9f0a;
    animation: catTwinkle 1.4s ease-in-out infinite;
  }
  .cat-star.s1 { left: 2px; top: 4px; animation-delay: 0s; }
  .cat-star.s2 { right: 2px; top: 10px; animation-delay: 0.6s; }
  .cat-hint {
    margin-top: 3px; font-size: 10.5px; color: var(--muted); opacity: 0.8;
  }

  @keyframes catFloatZ {
    0% { opacity: 0; transform: translate(0, 4px) scale(0.8); }
    25% { opacity: 0.95; }
    80% { opacity: 0.7; }
    100% { opacity: 0; transform: translate(8px, -16px) scale(1.1); }
  }
  @keyframes catPop {
    0%, 100% { opacity: 0.35; transform: translate(-50%, 2px) scale(0.85); }
    50% { opacity: 1; transform: translate(-50%, -6px) scale(1.12); }
  }
  @keyframes catTwinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cat-z, .cat-heart, .cat-star, .wiz-stage, .home-stage { animation: none !important; }
  }

  /* PREMIUM WIZARD STAGE */
  .wiz-stage {
    width: min(100%, clamp(640px, 74vw, 1060px));
    margin: auto;
    animation: fadeSlideIn 0.22s ease-out;
  }
  .wiz-stage.narrow {
    width: min(100%, clamp(580px, 66vw, 920px));
  }
  .main-pane.is-fullscreen .wiz-stage,
  .main-pane.is-fullscreen .wiz-stage.narrow {
    width: min(100%, 1240px);
  }
  .wiz-hero { text-align: center; margin-bottom: clamp(10px, 1.8vh, 22px); }
  .wiz-title {
    margin: 4px 0 6px; font-size: clamp(20px, 2.2vw, 32px); font-weight: 750; letter-spacing: -0.025em;
  }
  .wiz-sub {
    margin: 0 auto; max-width: min(92%, 680px); font-size: clamp(12.5px, 1.05vw, 15px); color: var(--muted);
  }
  .wiz-next-hint {
    text-align: center; font-size: clamp(11.5px, 0.95vw, 13.5px); color: var(--muted); margin: 4px 0 0;
  }

  /* 3 CAT PICKER CARDS */
  .cat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 1.4vw, 18px);
    margin-bottom: clamp(10px, 1.6vh, 18px);
  }
  .cat-card {
    border: 1.5px solid var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow);
    border-radius: 14px; padding: clamp(10px, 1.4vw, 20px) clamp(8px, 1vw, 14px); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    transition: border-color 0.14s, transform 0.12s, background 0.14s;
  }
  .cat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .cat-card.active {
    border-color: var(--accent); background: var(--accent-soft);
  }
  .cat-card .cat-halo {
    width: clamp(58px, 5.8vw, 90px); height: clamp(52px, 5.2vw, 80px);
  }
  .cat-card .cat-svg {
    width: clamp(52px, 5.4vw, 84px); height: clamp(46px, 4.8vw, 74px);
  }
  .cat-card-name {
    font-size: clamp(13px, 1.1vw, 16.5px); font-weight: 700; color: var(--text); margin-top: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .cat-card-tag {
    font-size: clamp(11px, 0.9vw, 13px); color: var(--muted); margin-top: 2px;
  }

  /* THEME MINI CARDS */
  .theme-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 1.4vw, 18px);
    margin-bottom: 6px;
  }
  .theme-card {
    border: 1.5px solid var(--card-border); background: var(--card-bg);
    border-radius: 13px; padding: clamp(8px, 1.1vw, 14px) clamp(10px, 1.2vw, 16px); cursor: pointer;
    text-align: center; transition: border-color 0.14s, transform 0.12s, background 0.14s;
  }
  .theme-card:hover { transform: translateY(-1px); border-color: var(--accent); }
  .theme-card.active {
    border-color: var(--accent); background: var(--accent-soft);
  }
  .theme-preview {
    height: clamp(28px, 4.2vh, 56px); border-radius: 8px; margin-bottom: 6px; position: relative;
    overflow: hidden; border: 1px solid rgba(128, 128, 128, 0.22);
    display: flex; align-items: flex-start; padding: 5px; gap: 4px;
  }
  .theme-preview.pv-light { background: linear-gradient(160deg, #FCF8F0, #EFE4CE); }
  .theme-preview.pv-dark { background: linear-gradient(160deg, #2A2620, #171512); }
  .theme-preview.pv-system {
    background: linear-gradient(135deg, #FAF5EA 50%, #1C1915 50%);
  }
  .pv-dot { width: 5px; height: 5px; border-radius: 999px; background: rgba(128, 128, 128, 0.45); }
  .theme-lbl {
    font-size: clamp(12px, 1vw, 14px); font-weight: 600; color: var(--text);
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }

  /* COMPACT DIAGNOSTIC STRIP */
  .diag-strip {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 13px; padding: clamp(11px, 1.3vw, 16px) clamp(14px, 1.6vw, 20px);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  .diag-hw { font-size: clamp(12.5px, 1vw, 14.5px); font-weight: 600; color: var(--text); }
  .diag-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tool-pill {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .tool-pill.ok { background: var(--green-soft); color: var(--green); }
  .tool-pill.warn { background: var(--warn-soft); color: var(--warn); }

  /* ENGINE 3 CARDS */
  .engine-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 1.4vw, 18px);
    margin-bottom: clamp(10px, 1.6vh, 18px);
  }
  .engine-card {
    border: 1.5px solid var(--card-border); background: var(--card-bg);
    border-radius: 13px; padding: clamp(12px, 1.5vw, 22px); cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color 0.14s, transform 0.12s, background 0.14s;
  }
  .engine-card:hover { transform: translateY(-1px); border-color: var(--accent); }
  .engine-card.active {
    border-color: var(--accent); background: var(--accent-soft);
  }
  .engine-head {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .engine-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--sand); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .engine-icon svg { width: 15px; height: 15px; }
  .engine-title { font-size: clamp(13px, 1.1vw, 16.5px); font-weight: 700; color: var(--text); }
  .engine-desc { font-size: clamp(11.5px, 0.9vw, 13.5px); color: var(--muted); line-height: 1.38; }

  /* VISUAL LANGUAGE CARD & SEGMENTED */
  .lang-hero {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: clamp(14px, 2vw, 26px); margin-bottom: clamp(10px, 1.6vh, 18px);
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .lang-box {
    flex: 1; display: flex; flex-direction: column; gap: 3px;
    padding: clamp(8px, 1vw, 14px) 12px; border-radius: 10px; background: var(--pill-bg);
    border: 1px solid var(--card-border);
  }
  .lang-box-lbl { font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .lang-arrow {
    font-size: 18px; font-weight: 700; color: var(--accent-text); flex-shrink: 0;
  }
  .seg-ctrl {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 4px; border-radius: 11px; background: var(--kbd-bg);
    border: 1px solid var(--card-border);
  }
  .seg-ctrl.two { grid-template-columns: repeat(2, 1fr); }
  .seg-btn {
    border: none; background: transparent; color: var(--muted);
    font-family: inherit; font-size: clamp(12px, 0.95vw, 14px); font-weight: 600;
    padding: clamp(7px, 0.9vh, 11px) 10px; border-radius: 8px; cursor: pointer;
    transition: background 0.13s, color 0.13s;
  }
  .seg-btn.active {
    background: var(--pill-bg); color: var(--text); box-shadow: var(--pill-shadow);
  }
  .vis-explain {
    margin: 8px 2px 0; font-size: clamp(11.5px, 0.95vw, 13.5px); color: var(--muted); text-align: center;
  }

  /* HOME SCENIC HERO + BENTO + STUDIO BANNER */
  .home-stage {
    width: 100%;
    max-width: 1120px;
    margin: auto;
    display: flex; flex-direction: column;
    gap: clamp(12px, 1.8vh, 18px);
    animation: fadeSlideIn 0.2s ease-out;
  }
  .main-pane.is-fullscreen .home-stage {
    width: 100%; max-width: none; min-height: 100%; margin: 0;
    gap: clamp(16px, 2.2vh, 26px);
  }
  .home-hero-scenic {
    position: relative; overflow: hidden;
    border-radius: 20px;
    background: linear-gradient(125deg, var(--card-bg) 0%, var(--scenic-sky) 100%);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    padding: clamp(16px, 2.4vh, 26px) clamp(20px, 2.8vw, 32px);
  }
  .main-pane.is-fullscreen .home-hero-scenic {
    flex: 1.05; display: flex; align-items: center;
    padding: clamp(24px, 3.6vh, 46px) clamp(28px, 3.6vw, 52px);
  }
  .hero-scenic-bg {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .hero-scenic-branch {
    position: absolute; top: -6px; left: -6px; width: 220px; height: auto; opacity: 0.78;
  }
  .main-pane.is-fullscreen .hero-scenic-branch {
    width: clamp(240px, 24vw, 340px);
  }
  .hero-scenic-fuji {
    position: absolute; right: -8px; bottom: -4px; width: clamp(240px, 34vw, 340px); height: auto; opacity: 0.85;
  }
  .main-pane.is-fullscreen .hero-scenic-fuji {
    width: clamp(320px, 36vw, 540px);
  }
  .hero-scenic-fg {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: clamp(14px, 2.4vw, 28px);
  }
  .main-pane.is-fullscreen .hero-scenic-fg {
    width: 100%; gap: clamp(22px, 3.2vw, 44px);
  }
  .home-hero-scenic .cat-arena {
    width: clamp(118px, 12vw, 158px);
    height: clamp(80px, 8.2vw, 108px);
  }
  .main-pane.is-fullscreen .home-hero-scenic .cat-arena {
    width: clamp(148px, 14vw, 210px);
    height: clamp(102px, 10vw, 142px);
  }
  .hero-copy {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  }
  .hero-headline {
    margin: 0;
    font-size: clamp(22px, 2.5vw, 32px);
    font-weight: 800; line-height: 1.15; letter-spacing: -0.025em;
    color: var(--text);
  }
  .main-pane.is-fullscreen .hero-headline {
    font-size: clamp(28px, 3vw, 44px);
  }
  .hero-headline-accent {
    position: relative; display: inline-block;
    color: var(--accent-text);
  }
  .hero-brush-line {
    display: block; width: 100%; height: 9px; margin-top: 2px;
    pointer-events: none;
  }
  .hero-controls-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .hero-status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--sand); color: var(--muted);
  }
  .hero-status.on {
    background: var(--green-soft); color: var(--green);
    border-color: rgba(79, 127, 59, 0.18);
  }
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0;
  }
  .pulse-dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .pulse-dot.off { background: var(--muted); }
  .hero-controls-row .pill-btn {
    min-height: 30px; padding: 5px 12px; font-size: 12px;
  }
  .hero-controls-row .pill-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
  .pill-btn.lg {
    min-height: 38px; padding: 9px 22px;
    font-size: clamp(13px, 1vw, 14.5px); font-weight: 650;
  }

  .bento-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(10px, 1.4vw, 16px);
  }
  .main-pane.is-fullscreen .bento-grid {
    flex: 1.15; gap: clamp(14px, 1.8vw, 24px);
  }
  .bento-card {
    background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
    border-radius: 16px; padding: clamp(14px, 1.5vw, 18px) clamp(15px, 1.6vw, 20px);
    display: flex; align-items: flex-start; gap: 14px;
    min-height: 98px;
  }
  .main-pane.is-fullscreen .bento-card {
    height: 100%; align-items: center;
    padding: clamp(18px, 2.1vw, 30px); gap: 18px;
  }
  .bento-card.clickable {
    cursor: pointer; transition: border-color 0.14s, transform 0.12s, background 0.14s;
  }
  .bento-card.clickable:hover { border-color: var(--accent-border); transform: translateY(-1px); }
  .bento-ico-tile {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: var(--sand); color: var(--ink);
    border: 1px solid var(--card-border);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .main-pane.is-fullscreen .bento-ico-tile {
    width: 54px; height: 54px; border-radius: 15px;
  }
  .bento-ico-tile svg { width: 21px; height: 21px; stroke-width: 1.85; }
  .bento-main {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;
  }
  .bento-k-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .bento-k {
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .bento-chev { font-size: 16px; color: var(--muted); font-weight: 600; line-height: 1; }
  .bento-v {
    font-size: clamp(14.5px, 1.15vw, 17px); font-weight: 700; color: var(--text);
    line-height: 1.25;
  }
  .main-pane.is-fullscreen .bento-v {
    font-size: clamp(16px, 1.35vw, 21px);
  }
  .bento-pill {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    margin-top: 4px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    background: var(--sand); color: var(--ink); border: 1px solid var(--card-border);
  }
  .bento-pill.ok {
    background: var(--green-soft); color: var(--green); border-color: rgba(79, 127, 59, 0.16);
  }
  .bento-pill.warn {
    background: var(--warn-soft); color: var(--warn); border-color: transparent;
  }
  .kbd-grid {
    display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px;
  }
  .kbd-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .kbd-chip {
    font-size: 11px; font-weight: 700; color: var(--ink);
    background: var(--kbd-bg); border: 1px solid var(--card-border);
    padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .quick-actions-grid {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px;
  }
  .quick-btn {
    flex: 1; min-width: 118px; min-height: 32px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; padding: 5px 11px;
  }
  .quick-btn svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--ink); }

  /* FULL-WIDTH STUDIO BANNER CARD */
  .studio-banner {
    position: relative; overflow: hidden;
    border-radius: 18px;
    border: 1px solid var(--card-border);
    background: linear-gradient(115deg, var(--card-bg) 0%, var(--sand) 64%, var(--sand-strong) 100%);
    box-shadow: var(--card-shadow);
    padding: clamp(16px, 1.8vw, 22px) clamp(18px, 2vw, 24px);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    cursor: pointer; transition: border-color 0.14s, transform 0.12s;
  }
  .main-pane.is-fullscreen .studio-banner {
    flex: 0.85; padding: clamp(20px, 2.6vh, 34px) clamp(24px, 3vw, 42px);
  }
  .studio-banner:hover { border-color: var(--accent-border); transform: translateY(-1px); }
  .studio-banner.drag-over {
    border-color: var(--accent-border);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .studio-banner-left {
    position: relative; z-index: 1; flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 15px;
  }
  .studio-banner-ico {
    width: 46px; height: 46px; border-radius: 999px; flex-shrink: 0;
    background: var(--sand-strong); border: 1px solid var(--accent-border);
    color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .studio-banner-ico svg { width: 20px; height: 20px; }
  .studio-banner-copy {
    min-width: 0; display: flex; flex-direction: column; gap: 4px;
  }
  .studio-banner-title-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .studio-banner-title {
    font-size: clamp(15px, 1.2vw, 18px); font-weight: 750; color: var(--text);
  }
  .studio-banner-sub {
    font-size: 13px; color: var(--muted);
  }
  .studio-banner-actions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px;
  }
  .studio-banner-art {
    position: relative; z-index: 0; flex-shrink: 0;
    width: clamp(140px, 20vw, 220px); height: auto;
    pointer-events: none; opacity: 0.78;
  }
  .main-pane.is-fullscreen .studio-banner-art {
    width: clamp(200px, 24vw, 320px);
  }

  /* HORIZONTAL SETTINGS SUB-TABS */
  .settings-tabs {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 5px; margin-bottom: 14px;
    border-radius: 14px;
    background: var(--sand); border: 1px solid var(--card-border);
  }
  .settings-tab-btn {
    border: none; background: transparent; color: var(--muted);
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    padding: 6px 12px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.13s, color 0.13s;
  }
  .settings-tab-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .settings-tab-btn:hover:not(.active) { color: var(--text); background: var(--accent-soft); }
  .settings-tab-btn.active {
    background: var(--accent); color: var(--on-accent); box-shadow: var(--pill-shadow);
  }

  @media (max-width: 680px) {
    .hero-scenic-fg { flex-direction: column; align-items: flex-start; }
    .bento-grid, .engine-grid, .cat-grid { grid-template-columns: 1fr; }
    .studio-banner { flex-direction: column; align-items: flex-start; }
    .studio-banner-art { display: none; }
    .theme-grid { gap: 8px; }
    .lang-hero { flex-direction: column; gap: 10px; }
    .lang-arrow { transform: rotate(90deg); }
  }

  /* WIZARD STEP DOTS FOOTER */
  .main-footer {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 11px 24px 14px; border-top: 1px solid var(--row-sep);
    background: transparent; flex-shrink: 0;
  }
  .footer-left { display: flex; justify-content: flex-start; }
  .footer-right { display: flex; justify-content: flex-end; gap: 8px; }
  .step-dots { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .step-dot {
    width: 8px; height: 8px; border-radius: 999px; border: none; padding: 0;
    background: var(--kbd-bg); cursor: pointer;
    transition: width 0.2s ease, background 0.2s ease;
  }
  .step-dot.done { background: var(--accent-soft); border: 1px solid var(--accent); }
  .step-dot.active { width: 24px; background: var(--accent); }

  /* BORING NOTCH GROUPED SECTIONS (Settings) */
  .sec-title {
    margin: 14px 4px 7px; font-size: 13px; font-weight: 700; color: var(--text);
    letter-spacing: -0.01em;
  }
  .sec-title:first-child { margin-top: 4px; }
  .group-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; overflow: hidden; margin-bottom: 10px;
  }
  .group-row {
    position: relative;
    min-height: 44px; padding: 9px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .group-row + .group-row::before {
    content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
    background: var(--row-sep);
  }
  .group-row.clickable { cursor: pointer; }
  .group-row.clickable:hover { background: rgba(128, 128, 128, 0.05); }
  .row-left { min-width: 0; flex: 1; }
  .row-title {
    font-size: 13px; font-weight: 400; color: var(--text);
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .row-sub {
    font-size: 11.5px; color: var(--muted); margin-top: 2px;
  }
  .row-right {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }

  /* NATIVE-STYLE BLUE POPUP SELECT */
  .pop-wrap {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .pop-wrap select {
    appearance: none; -webkit-appearance: none;
    border: none; background: transparent; color: var(--accent-text);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 4px 24px 4px 4px; cursor: pointer; outline: none;
    text-align-last: right;
  }
  .pop-chev {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; border-radius: 5px;
    background: var(--accent-soft); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .pop-chev svg { width: 11px; height: 11px; }

  /* CONTROLS */
  .pill-btn {
    border: 1px solid var(--pill-border); background: var(--pill-bg); color: var(--text);
    box-shadow: var(--pill-shadow); border-radius: 999px;
    padding: 5px 13px; font-size: 12px; font-weight: 550; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pill-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .pill-btn:hover:not(:disabled) { background: var(--pill-hover); }
  .pill-btn.blue {
    background: var(--accent); border-color: var(--accent-border, var(--accent)); color: var(--on-accent);
    box-shadow: 0 2px 6px rgba(184, 131, 36, 0.18); font-weight: 650;
  }
  .pill-btn.blue:hover:not(:disabled) { background: var(--accent-hover); }
  .pill-btn.danger { color: var(--red); }
  .pill-btn.sm { padding: 4px 10px; font-size: 11.5px; min-height: 28px; }
  .pill-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .badge {
    font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    display: inline-flex; align-items: center;
  }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.rec { background: var(--accent-soft); color: var(--accent-text); }

  .radio-dot {
    width: 17px; height: 17px; border-radius: 999px;
    border: 1.5px solid var(--muted); display: inline-flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .radio-dot.on { border-color: var(--accent-border, var(--accent)); background: var(--accent); }
  .radio-dot.on::after {
    content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--on-accent);
  }

  .txt-input {
    width: 100%; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--pill-border); border-radius: 8px;
    padding: 7px 10px; font-size: 12.5px; font-family: inherit;
    -webkit-user-select: text; outline: none;
  }
  .txt-input:focus { border-color: var(--accent); }

  .prog-block {
    padding: 6px 14px 10px; display: none;
  }
  .prog-block.show { display: block; }
  .prog-track {
    width: 100%; height: 5px; border-radius: 999px;
    background: var(--prog-track); overflow: hidden;
  }
  .prog-fill {
    height: 100%; width: 0%; background: var(--accent); transition: width 0.2s ease;
  }
  .prog-meta {
    margin-top: 4px; font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }

  .banner {
    margin: 10px auto 0; max-width: 660px; padding: 8px 12px;
    border-radius: 10px; font-size: 12px; display: none; text-align: center;
  }
  .banner.show { display: block; }
  .banner.ok { background: var(--green-soft); color: var(--green); }
  .banner.err { background: var(--red-soft); color: var(--red); }

  /* STUDIO / IN-APP TEST PAGE */
  .studio-shell {
    width: 100%; max-width: none; margin: 0;
    display: flex; flex-direction: column; gap: 10px;
    flex: 1; min-height: 0;
    animation: fadeSlideIn 0.18s ease-out;
  }
  .studio-toolbar {
    background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
    border-radius: 14px; padding: 9px 14px; min-height: 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .studio-bar-grp {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .studio-toolbar .pill-btn {
    min-height: 32px; padding: 6px 13px; font-size: 12.5px;
  }
  .studio-toolbar .pill-btn svg { width: 14px; height: 14px; }
  .studio-mode-seg {
    display: inline-flex; padding: 2px; border-radius: 999px;
    background: var(--kbd-bg); border: 1px solid var(--card-border);
  }

  const pendingBridge = new Map();
  let bridgeSeq = 0;
  function callBridge(action, payload = {}) {
    const id = String(++bridgeSeq);
    return new Promise((resolve, reject) => {
      pendingBridge.set(id, { resolve, reject });
      window.webkit.messageHandlers.bridge.postMessage({ id, action, payload });
    });
  }
  window.__smtBridgeResolve = (msg) => {
    const entry = pendingBridge.get(msg.id);
    if (!entry) return;
    pendingBridge.delete(msg.id);
    if (msg.ok) entry.resolve(msg.data);
    else entry.reject(new Error((msg.data && msg.data.error) || "Error"));
  };

  function getProviderInfo(prov) {
    return CLOUD_PROVIDERS[prov] || CLOUD_PROVIDERS.gemini;
  }

  function formattedCloudModelId() {
    const prov = CLOUD_PROVIDERS[form.api_provider] ? form.api_provider : "gemini";
    const pinfo = getProviderInfo(prov);
    const raw = (form.api_model || (pinfo.models[0] && pinfo.models[0].v) || "").trim();
    if (!raw) return prov;
    if (prov === "gemini") return raw.replace(/^gemini:/, "");
    if (raw.startsWith(`${prov}:`)) return raw;
    return `${prov}:${raw}`;
  }

  function parseDefaultCloudModel(spec) {
    const s = String(spec || "").trim();
    if (!s || s.startsWith("ollama:")) return null;
    const colon = s.indexOf(":");
    if (colon > 0) {
      const prefix = s.slice(0, colon).toLowerCase();
      if (CLOUD_PROVIDERS[prefix]) {
        return { provider: prefix, model: s.slice(colon + 1).trim() };
      }
    }
    if (s.toLowerCase().startsWith("gemini-")) {
      return { provider: "gemini", model: s };
    }
    return { provider: form.api_provider || "gemini", model: s };
  }

  const WALK_CIRCLE_STEPS = Array.from({ length: 16 }, (_, i) => {
    const a = (i / 16) * Math.PI * 2;
    let grid;
    if (i <= 1 || i >= 14) grid = i % 2 === 0 ? CAT_WALK_FRONT_0 : CAT_WALK_FRONT_1;
    else if (i <= 5) grid = i % 2 === 0 ? CAT_WALK_RIGHT_0 : CAT_WALK_RIGHT_1;
    else if (i <= 9) grid = i % 2 === 0 ? CAT_WALK_BACK_0 : CAT_WALK_BACK_1;
    else grid = i % 2 === 0 ? CAT_WALK_LEFT_0 : CAT_WALK_LEFT_1;
    return {
      dx: Math.sin(a),
      dy: Math.cos(a),
      scale: Number((0.96 + 0.08 * Math.cos(a)).toFixed(3)),
      grid,
    };
  });

    sleep: { interval: 580, frames: [CAT_SLEEP_0, CAT_SLEEP_1, CAT_SLEEP_2, CAT_SLEEP_1] },
    spin: { interval: 115, frames: WALK_CIRCLE_STEPS.map((s) => s.grid) },
    happy: { interval: 210, frames: [CAT_HAPPY_BASE, shiftUp(CAT_HAPPY_TAIL_UP), CAT_HAPPY_TAIL_UP, CAT_HAPPY_BASE] },

  function catSvgFromGrid(grid, mascotId) {
    const pal = (CAT_PALETTES[mascotId] || CAT_PALETTES.mochi).pal;
    let rects = "";
    for (let y = 0; y < grid.length; y++) {
      const row = grid[y];
      for (let x = 0; x < row.length; x++) {
        const fill = pal[row[x]];
        if (fill) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`;
      }
    }
    return `<svg class="cat-svg" viewBox="0 -1 16 15" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
  }

  function effectiveSlotMode(slotId, baseMode) {
    const until = spinUntilMap.get(slotId) || 0;
    return (isBusy || Date.now() < until) ? "spin" : baseMode;

  function catParticlesHtml(slotId, mode) {
    const until = spinUntilMap.get(slotId) || 0;
    if (Date.now() < until) return `<span class="cat-heart">♥</span>`;
    if (mode === "sleep") return `<span class="cat-z z1">z</span><span class="cat-z z2">Z</span><span class="cat-z z3">z</span>`;
    if (mode === "happy") return `<span class="cat-star s1">✦</span><span class="cat-star s2">✦</span>`;
    return "";
  }

  function catBubbleText(slotId, baseMode) {
    const until = spinUntilMap.get(slotId) || 0;
    if (isBusy || Date.now() < until) return tr("cat_say_walk");
    if (baseMode === "sleep") return tr("cat_say_sleep");
    return tr("cat_say_awake");
  }

  function catSpriteOnlyHtml(baseMode, mascotId = selectedMascot, slotId = "main", rx = 34, ry = 9, showGlow = false, activeGlow = false) {
    const mode = effectiveSlotMode(slotId, baseMode);
    const cfg = CAT_MODES[mode] || CAT_MODES.awake;
    const st = slotStateMap.get(slotId) || { idx: 0, mode };
    const idx = st.idx % cfg.frames.length;
    const frame = cfg.frames[idx];
    const walking = mode === "spin";
    const step = walking ? WALK_CIRCLE_STEPS[idx % WALK_CIRCLE_STEPS.length] : null;
    const tx = step ? (step.dx * rx).toFixed(1) : "0";
    const ty = step ? (step.dy * ry).toFixed(1) : "0";
    const sc = step ? step.scale : 1;
    const until = spinUntilMap.get(slotId) || 0;
    const showBubble = (Date.now() < until) ? "show" : "";
    return `
      <div class="cat-arena">
        ${showGlow ? `<div class="cat-glow ${activeGlow ? "on" : "off"}"></div>` : ""}
        <div class="cat-rug"></div>
        ${slotId === "main" ? `<span class="cat-bubble ${showBubble}" data-cat-bubble="${slotId}">${catBubbleText(slotId, baseMode)}</span>` : ""}
        <div class="cat-walker" data-cat-walker="${slotId}" data-walk-rx="${rx}" data-walk-ry="${ry}" style="transform:translate(${tx}px, ${ty}px) scale(${sc})">
          <div class="cat-halo">
            <div class="cat-particles" data-cat-part="${slotId}">${catParticlesHtml(slotId, mode)}</div>
            <div data-cat-slot="${slotId}" data-cat-base="${baseMode}" data-cat-mascot="${mascotId}">${catSvgFromGrid(frame, mascotId)}</div>
          </div>
          <div class="cat-shadow"></div>
        </div>

  function applySlotFrame(slot, st, mode, mascotId, slotId) {
    const cfg = CAT_MODES[mode] || CAT_MODES.awake;
    const idx = st.idx % cfg.frames.length;
    slot.innerHTML = catSvgFromGrid(cfg.frames[idx], mascotId);
    const walker = document.querySelector(`[data-cat-walker="${slotId}"]`);
    if (walker) {
      if (mode === "spin") {
        const rx = Number(walker.getAttribute("data-walk-rx")) || 34;
        const ry = Number(walker.getAttribute("data-walk-ry")) || 9;
        const step = WALK_CIRCLE_STEPS[idx % WALK_CIRCLE_STEPS.length];
        walker.style.transform = `translate(${(step.dx * rx).toFixed(1)}px, ${(step.dy * ry).toFixed(1)}px) scale(${step.scale})`;
      } else {
        walker.style.transform = "translate(0px, 0px) scale(1)";
      }
    }
  }

  function syncCatAnimation() {
    if (catTimer) {
      clearInterval(catTimer);
      catTimer = null;
    }
    const slots = document.querySelectorAll("[data-cat-slot]");
    if (!slots.length) return;
    catTimer = setInterval(() => {
      const activeSlots = document.querySelectorAll("[data-cat-slot]");
      if (!activeSlots.length) {
        clearInterval(catTimer);
        catTimer = null;
        return;
      }
      const now = Date.now();
      for (const slot of activeSlots) {
        const slotId = slot.getAttribute("data-cat-slot") || "main";
        const baseMode = slot.getAttribute("data-cat-base") || "awake";
        const mascotId = slot.getAttribute("data-cat-mascot") || selectedMascot;
        const mode = effectiveSlotMode(slotId, baseMode);
        const cfg = CAT_MODES[mode] || CAT_MODES.awake;
        let st = slotStateMap.get(slotId);
        if (!st || st.mode !== mode) {
          st = { mode, idx: 0, lastAt: now };
          slotStateMap.set(slotId, st);
          const pEl = document.querySelector(`[data-cat-part="${slotId}"]`);
          if (pEl) pEl.innerHTML = catParticlesHtml(slotId, mode);
          const bEl = document.querySelector(`[data-cat-bubble="${slotId}"]`);
          if (bEl) {
            bEl.textContent = catBubbleText(slotId, baseMode);
            bEl.classList.toggle("show", now < (spinUntilMap.get(slotId) || 0));
          }
          applySlotFrame(slot, st, mode, mascotId, slotId);
          continue;
        }
        if (now - st.lastAt >= cfg.interval) {
          st.idx = (st.idx + 1) % cfg.frames.length;
          st.lastAt = now;
          applySlotFrame(slot, st, mode, mascotId, slotId);
        }
      }
    }, 100);
  }

  function triggerCatSpin(ms = 3680, slotId = "main") {
    spinUntilMap.set(slotId, Date.now() + ms);
    const slot = document.querySelector(`[data-cat-slot="${slotId}"]`);
    if (slot) {
      const baseMode = slot.getAttribute("data-cat-base") || "awake";
      const mascotId = slot.getAttribute("data-cat-mascot") || selectedMascot;
      const st = { mode: "spin", idx: 0, lastAt: Date.now() };
      slotStateMap.set(slotId, st);
      const pEl = document.querySelector(`[data-cat-part="${slotId}"]`);
      if (pEl) pEl.innerHTML = catParticlesHtml(slotId, "spin");
      const bEl = document.querySelector(`[data-cat-bubble="${slotId}"]`);
      if (bEl) {
        bEl.textContent = catBubbleText(slotId, baseMode);
        bEl.classList.add("show");
      }
      applySlotFrame(slot, st, "spin", mascotId, slotId);
    }
    syncCatAnimation();
  }

  function formatBytes(b) {
    if (!b || b <= 0) return "";
    if (b >= 1e9) return (b / 1e9).toFixed(2) + " Go";
    return (b / 1e6).toFixed(0) + " Mo";
  }

    const installed = (sysState?.ollama?.models) || [];

  function progHtml(tool) {
    const p = progressState[tool];
    const show = Boolean(p);
    const pct = p && typeof p.percent === "number" && p.percent >= 0 ? p.percent : 25;
    const size = p && p.total > 0 ? `${formatBytes(p.completed)} / ${formatBytes(p.total)} (${pct}%)` : (p && p.percent >= 0 ? `${pct}%` : "");
    const cancelBtn = tool === "pull" ? ` <button id="btn-cancel-pull" class="pill-btn danger" style="padding:2px 8px;font-size:10px;margin-left:6px">${tr("cancel_btn")}</button>` : "";
    return `
      <div class="prog-block ${show ? "show" : ""}" data-prog="${tool}">
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="prog-meta"><span>${p ? (p.status || p.phase || "") : ""}</span><span>${size}${cancelBtn}</span></div>
      </div>
    `;
  }

  window.__smtBridgeEvent = (evt) => {
    if (evt.event === "fullscreen") {
      const active = Boolean(evt.payload && evt.payload.active);
      const pane = document.getElementById("main-pane");
      if (pane) pane.classList.toggle("is-fullscreen", active);
      const layout = document.getElementById("app-layout") || (document.querySelector && document.querySelector(".app-layout"));
      if (layout) layout.classList.toggle("is-fullscreen", active);
      return;
    }
    if (evt.event === "navigate") {
      const v = evt.payload && evt.payload.view;
      if (v === "wizard") {
        currentView = "wizard";
        wizardStep = 1;
        bannerMsg = null;
        render();
      } else if (v === "home" || v === "dashboard") {
        currentView = "home";
        bannerMsg = null;
        render();
      } else if (v === "settings") {
        currentView = "settings";
        settingsTab = "general";
        bannerMsg = null;
        render();
      } else if (v === "test" || v === "studio") {
        openStudioView();
      }
      return;
    }
    if (evt.event === "progress") {
      const p = evt.payload || {};
      progressState[p.tool] = p;
      const box = document.querySelector(`.prog-block[data-prog="${p.tool}"]`);
      if (box) {
        box.classList.add("show");
        const pct = typeof p.percent === "number" && p.percent >= 0 ? p.percent : 25;
        box.querySelector(".prog-fill").style.width = pct + "%";
        const metas = box.querySelectorAll(".prog-meta span");
        if (metas[0]) metas[0].textContent = p.status || p.phase || "";
        if (metas[1]) {
          const size = p.total > 0 ? `${formatBytes(p.completed)} / ${formatBytes(p.total)} (${pct}%)` : (pct >= 0 ? `${pct}%` : "");
          const txtNode = metas[1].firstChild;
          if (txtNode && txtNode.nodeType === 3) txtNode.textContent = size;
          else if (!metas[1].querySelector("button")) metas[1].textContent = size;
        }
      }
    }
  };

  function resolvedThemeMode() {
    if (currentTheme === "light" || currentTheme === "dark") return currentTheme;
    if (typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
      return "light";
    }
    return "dark";
  }

  function renderSidebar() {
    const sidebarEl = document.getElementById("sidebar");
    if (currentView === "wizard") {
      sidebarEl.classList.add("hidden");
      return;
    }
    sidebarEl.classList.remove("hidden");

    const brandCat = document.getElementById("sidebar-brand-cat");
    if (brandCat) brandCat.innerHTML = catSvgFromGrid(CAT_FACE_BASE, selectedMascot);

    const nav = document.getElementById("sidebar-nav");
    nav.innerHTML = "";

    const items = [
      { id: "home", icon: "home", label: tr("nav_home") },
      { id: "test", icon: "sparkles", label: tr("nav_studio") },
      { id: "settings", icon: "gear", label: tr("nav_settings") },
    ];

    for (const it of items) {
      const btn = document.createElement("button");
      const active = it.id === currentView;
      btn.type = "button";
      btn.className = `nav-item ${active ? "active" : ""}`;
      btn.setAttribute("data-nav-view", it.id);
      btn.innerHTML = `${ICONS[it.icon]}<span class="lbl">${it.label}</span>`;
      btn.addEventListener("click", () => {
        bannerMsg = null;
        if (it.id === "test") {
          openStudioView();
        } else {
          currentView = it.id;
          render();
        }
      });
      nav.appendChild(btn);
    }

    const mode = resolvedThemeMode();
    const btnLight = document.getElementById("btn-theme-light");
    const btnDark = document.getElementById("btn-theme-dark");
    if (btnLight) {
      btnLight.innerHTML = ICONS.sun;
      btnLight.title = tr("theme_light");
      btnLight.classList.toggle("on", mode === "light");
    }
    if (btnDark) {
      btnDark.innerHTML = ICONS.moon;
      btnDark.title = tr("theme_dark");
      btnDark.classList.toggle("on", mode === "dark");
    }
  }

      ? `${tr("ph_api_saved")} (${sysState.config.api_key_masked})`

    const providerOpts = Object.entries(CLOUD_PROVIDERS).map(([id, info]) => ({ v: id, l: info.label }));
    const presetModels = pinfo.models || [];
    const currentModel = (form.api_model || (presetModels[0] && presetModels[0].v) || "").trim();

  function renderWizardHtml() {
    if (wizardStep === 1) {
      const cats = [
        { id: "mochi", t: tr("cat_mochi_t"), d: tr("cat_mochi_d") },
        { id: "kuro", t: tr("cat_kuro_t"), d: tr("cat_kuro_d") },
        { id: "sakura", t: tr("cat_sakura_t"), d: tr("cat_sakura_d") },
      ];
      const catCards = cats.map((c) => `
        <button type="button" class="cat-card ${selectedMascot === c.id ? "active" : ""}" data-pick-cat="${c.id}">
          ${catSpriteOnlyHtml("awake", c.id, c.id, 15, 5, false)}
          <div class="cat-card-name">${c.t}${selectedMascot === c.id ? " ✓" : ""}</div>
          <div class="cat-card-tag">${c.d}</div>
        </button>
      `).join("");

      const themes = [
        { id: "light", lbl: tr("theme_light"), pv: "pv-light" },
        { id: "dark", lbl: tr("theme_dark"), pv: "pv-dark" },
        { id: "system", lbl: tr("theme_system"), pv: "pv-system" },
      ];
      const themeCards = themes.map((t) => `
        <button type="button" class="theme-card ${currentTheme === t.id ? "active" : ""}" data-pick-theme="${t.id}">
          <div class="theme-preview ${t.pv}"><span class="pv-dot"></span><span class="pv-dot"></span><span class="pv-dot"></span></div>
          <div class="theme-lbl">${t.lbl}${currentTheme === t.id ? " ✓" : ""}</div>
        </button>
      `).join("");

      return `
        <div class="wiz-stage">
          <div class="wiz-hero" style="margin-bottom:12px">
            <h2 class="wiz-title">${tr("wiz_t1")}</h2>
            <p class="wiz-sub">${tr("wiz_s1")}</p>
          </div>
          <div class="cat-grid">${catCards}</div>
          <div class="theme-grid">${themeCards}</div>
        </div>
      `;
    }

    if (wizardStep === 2) {
      const engineCards = [
        { id: "local", icon: "cpu", t: tr("mode_local_t"), d: tr("mode_local_d"), rec: true },
        { id: "api", icon: "globe", t: tr("mode_api_t"), d: tr("mode_api_d"), rec: false },
        { id: "both", icon: "disc", t: tr("mode_both_t"), d: tr("mode_both_d"), rec: false },
      ].map((m) => `
        <button type="button" class="engine-card ${form.engine_mode === m.id ? "active" : ""}" data-pick-mode="${m.id}" style="text-align:left">
          <div class="engine-head">
            <span class="engine-icon">${ICONS[m.icon]}</span>
            ${m.rec ? `<span class="badge rec">${tr("recommended")} · ${sysState.ram_gb} Go</span>` : `<span class="radio-dot ${form.engine_mode === m.id ? "on" : ""}"></span>`}
          </div>
          <div class="engine-title">${m.t}</div>
          <div class="engine-desc">${m.d}</div>
        </button>
      `).join("");

      const nextHint = form.engine_mode === "api"
        ? tr("wiz_hint_api")
        : (form.engine_mode === "both" ? tr("wiz_hint_both") : tr("wiz_hint_local"));

      return `
        <div class="wiz-stage">
          <div class="wiz-hero">
            ${renderCatWidgetHtml("awake", true)}
            <h2 class="wiz-title">${tr("wiz_t2")}</h2>
            <p class="wiz-sub">${tr("wiz_s2")}</p>
          </div>
          <div class="engine-grid">${engineCards}</div>
          <p class="wiz-next-hint">${nextHint}</p>
        </div>
      `;
    }

    if (wizardStep === 3) {
      const showLocal = form.engine_mode !== "api";
      const showApi = form.engine_mode !== "local";
      const pyOk = !!(sysState.python && sysState.python.installed);
      const ol = sysState.ollama || {};
      const olOk = !!(ol.installed && ol.running);
      const needsTool = !pyOk || (showLocal && !olOk);
      const keyPh = sysState.config?.has_api_key ? tr("ph_api_saved") : tr("ph_api");

      const t2Title = form.engine_mode === "api" ? tr("wiz_t2_api") : (form.engine_mode === "both" ? tr("wiz_t2_both") : tr("wiz_t2_local"));
      const t2Sub = form.engine_mode === "api" ? tr("wiz_s2_api") : (form.engine_mode === "both" ? tr("wiz_s2_both") : tr("wiz_s2_local"));
      const spinning = Boolean(isBusy || progressState.pull || progressState.python || (showLocal && progressState.ollama));

      const modelRows = LOCAL_MODELS.slice(0, 3).map((m) => {
        const inst = hasOllamaModel(m.id);
        const rec = m.id === sysState.recommended_model;
        const sel = form.local_model === m.id;
        return `
          <div class="group-row">
            <div class="row-left">
              <div class="row-title">${m.name} ${rec ? `<span class="badge rec">${tr("recommended")}</span>` : ""} ${inst ? `<span class="badge ok">${tr("installed")}</span>` : ""}</div>
              <div class="row-sub">${uiLang === "en" ? m.desc_en : m.desc_fr}</div>
            </div>
            <div class="row-right">
              ${!inst ? `<button class="pill-btn blue btn-dl-mod" data-m="${m.id}">${tr("download_btn")}</button>` : ""}
              <button class="pill-btn ${sel ? "blue" : ""} btn-sel-mod" data-m="${m.id}">${sel ? tr("selected_btn") : tr("select_btn")}</button>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="wiz-stage">
          <div class="wiz-hero" style="margin-bottom:10px">
            ${spinning ? renderCatWidgetHtml("spin", false) : ""}
            <h2 class="wiz-title">${t2Title}</h2>
            <p class="wiz-sub">${t2Sub}</p>
          </div>
          <div class="diag-strip" style="margin-bottom:10px">
            <span class="diag-hw">${sysState.chip} · ${sysState.ram_gb} Go</span>
            <div class="diag-pills">
              <span class="tool-pill ${sysState.ocr_ready ? "ok" : "warn"}">Vision OCR ${sysState.ocr_ready ? "✓" : "!"}</span>
              <span class="tool-pill ${pyOk ? "ok" : "warn"}">Python ${pyOk ? "✓" : "!"}</span>
              ${showLocal ? `<span class="tool-pill ${olOk ? "ok" : "warn"}">Ollama ${olOk ? "✓" : "!"}</span>` : ""}
              ${needsTool ? `<button id="btn-auto-tools" class="pill-btn blue">${tr("diag_auto_install")}</button>` : ""}
            </div>
          </div>
          ${progHtml("python")}${showLocal ? progHtml("ollama") : ""}
          ${showLocal ? `<div class="group-card">${modelRows}${progHtml("pull")}</div>` : ""}
          ${showApi ? sectionCloudApiCardHtml(true) : ""}
        </div>
      `;
    }

    if (wizardStep === 4) {
      const visDesc = form.vision_mode === "on" ? tr("vis_desc_on") : (form.vision_mode === "off" ? tr("vis_desc_off") : tr("vis_desc_auto"));
      return `
        <div class="wiz-stage narrow">
          <div class="wiz-hero">
            <h2 class="wiz-title">${tr("wiz_t3")}</h2>
            <p class="wiz-sub">${tr("wiz_s3")}</p>
          </div>
          <div class="lang-hero">
            <div class="lang-box">
              <span class="lang-box-lbl">${tr("wiz_src_box")}</span>
              ${popSelect("sel-src-lang", [
                { v: "en", l: tr("src_en") },
                { v: "ja", l: tr("src_ja") },
                { v: "auto", l: tr("src_auto") },
              ], form.source_lang)}
            </div>
            <span class="lang-arrow">→</span>
            <div class="lang-box">
              <span class="lang-box-lbl">${tr("wiz_tgt_box")}</span>
              ${popSelect("sel-tgt-lang", [
                { v: "fr", l: "Français" },
                { v: "en", l: "English" },
                { v: "es", l: "Español" },
                { v: "de", l: "Deutsch" },
                { v: "it", l: "Italiano" },
                { v: "pt", l: "Português" },
              ], form.target_lang)}
            </div>
          </div>
          <div class="group-card" style="padding:14px">
            <div class="row-title" style="margin-bottom:8px;font-weight:600">${tr("lbl_vis_mode")}</div>
            <div id="sel-vision-seg" class="seg-ctrl">
              <button type="button" class="seg-btn ${form.vision_mode === "off" ? "active" : ""}" data-vis="off">${tr("vis_fast")}</button>
              <button type="button" class="seg-btn ${form.vision_mode === "auto" ? "active" : ""}" data-vis="auto">${tr("vis_auto")}</button>
              <button type="button" class="seg-btn ${form.vision_mode === "on" ? "active" : ""}" data-vis="on">${tr("vis_best")}</button>
            </div>
            <p class="vis-explain">${visDesc}</p>
          </div>
        </div>
      `;
    }

    // Step 5: Navigateur & Prêt
    const isSaf = wizardBrowserTab !== "other";
    const us = sysState.userscripts || {};
    const safBadge = us.script_installed
      ? `<span class="badge ok">${tr("installed")} ✓</span>`
      : (us.detected_dir
          ? `<span class="badge rec">${tr("us_dir_found")}</span>`
          : (!us.app_installed ? `<span class="badge warn">${tr("missing")}</span>` : ""));
    const autoLabel = us.script_installed
      ? tr("us_update")
      : (us.detected_dir ? tr("us_auto_install") : tr("install_us"));
    const safDesc = us.detected_dir ? tr("br_saf_2") : (!us.app_installed ? tr("br_saf_need_app") : tr("br_saf_1"));

    return `
      <div class="wiz-stage narrow">
        <div class="wiz-hero">
          ${renderCatWidgetHtml("happy", false)}
          <h2 class="wiz-title">${tr("wiz_t4")}</h2>
          <p class="wiz-sub">${tr("wiz_s4")}</p>
        </div>

  function generateSampleMangaDataUrl(srcLang) {
    const canvas = document.createElement("canvas");
    canvas.width = 900;
    canvas.height = 1260;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const drawPanel = (x, y, w, h, fn) => {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.fillStyle = "#f9fafb";
      ctx.fillRect(x, y, w, h);
      fn(x, y, w, h);
      ctx.restore();
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = 6;
      ctx.strokeRect(x, y, w, h);
    };

    const drawSpeechBubble = (cx, cy, w, h, lines) => {
      const x = cx - w / 2;
      const y = cy - h / 2;
      const r = Math.min(w, h) * 0.28;
      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#111111";
      ctx.font = "700 26px 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const lineH = 34;
      const startY = cy - ((lines.length - 1) * lineH) / 2;
      lines.forEach((line, idx) => {
        ctx.fillText(line, cx, startY + idx * lineH);
      });
      ctx.restore();
    };

    const isJa = srcLang === "ja";
    const t1 = isJa ? ["待て...", "今何が起きたんだ?!"] : ["WAIT...", "WHAT JUST HAPPENED?!"];
    const t2 = isJa ? ["心配するな！", "すぐになんとかしよう。"] : ["DO NOT WORRY!", "WE CAN FIX THIS FAST."];
    const t3 = isJa ? ["いくぞ！", "次の章が待っている！"] : ["LET'S GO!", "THE NEXT CHAPTER AWAITS."];

    // Panel 1: dramatic speedlines + top bubble
    drawPanel(44, 44, 812, 360, (x, y, w, h) => {
      ctx.strokeStyle = "#d1d5db";
      ctx.lineWidth = 2;
      for (let i = 0; i < 36; i++) {
        const ang = (i / 36) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.72 + Math.cos(ang) * 90, y + h * 0.55 + Math.sin(ang) * 70);
        ctx.lineTo(x + w * 0.72 + Math.cos(ang) * 650, y + h * 0.55 + Math.sin(ang) * 650);
        ctx.stroke();
      }
      ctx.fillStyle = "#1f2937";
      ctx.beginPath();
      ctx.arc(x + w * 0.74, y + h * 0.62, 72, 0, Math.PI * 2);
      ctx.fill();
      drawSpeechBubble(x + 250, y + 125, 410, 126, t1);
    });

    // Panel 2: cute ink manga cat mascot + dialogue bubble
    drawPanel(44, 434, 812, 380, (x, y, w, h) => {
      ctx.fillStyle = "#111827";
      // Cat head silhouette
      const cx = x + 220;
      const cy = y + 235;
      ctx.beginPath();
      ctx.arc(cx, cy, 86, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - 72, cy - 42);
      ctx.lineTo(cx - 92, cy - 132);
      ctx.lineTo(cx - 18, cy - 80);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 72, cy - 42);
      ctx.lineTo(cx + 92, cy - 132);
      ctx.lineTo(cx + 18, cy - 80);
      ctx.closePath();
      ctx.fill();
      // Cat bright eyes
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx - 32, cy - 6, 13, 0, Math.PI * 2);
      ctx.arc(cx + 32, cy - 6, 13, 0, Math.PI * 2);
      ctx.fill();
      drawSpeechBubble(x + 565, y + 175, 420, 130, t2);
    });

    // Panel 3: action slash lines + finale bubble
    drawPanel(44, 844, 812, 372, (x, y, w, h) => {
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 4;
      for (let k = -200; k < w + 200; k += 28) {
        ctx.beginPath();
        ctx.moveTo(x + k, y);
        ctx.lineTo(x + k - 120, y + h);
        ctx.stroke();
      }
      drawSpeechBubble(x + 390, y + 170, 460, 132, t3);
    });

    return canvas.toDataURL("image/png");
  }

  function fitStudioBubbleFont(el, bubble) {
    if (!el || !bubble) return;
    const txt = String(bubble.translated || bubble.text || "");
    const w = el.clientWidth || 80;
    const h = el.clientHeight || 40;
    let size = Math.max(9, Math.min(22, Math.sqrt((w * h) / Math.max(txt.length, 4)) * 1.15));
    el.style.fontSize = size + "px";
    while (size > 7 && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2)) {
      size -= 0.7;
      el.style.fontSize = size.toFixed(1) + "px";
    }
    const scaled = Math.max(7, Math.min(48, size * (bubble.fontScale || 1.0)));
    el.style.fontSize = scaled.toFixed(1) + "px";
    const stage = document.getElementById("studio-stage");
    const stageH = stage ? stage.clientHeight : 0;
    el.dataset.fittedRatio = String(scaled / Math.max(1, stageH));
  }

  function fitAllStudioBubbles() {
    for (const el of document.querySelectorAll(".studio-bubble[data-bubble-id]")) {
      const id = Number(el.getAttribute("data-bubble-id"));
      const b = studio.bubbles.find((item) => item.id === id);

  function applyCropAndTranslate() {
    if (!studio.imageDataUrl) return Promise.resolve();
    const rect = studio.cropRect || { x: 0, y: 0, w: 1, h: 1 };
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = async () => {
        try {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          const sx = Math.max(0, Math.round(rect.x * w));
          const sy = Math.max(0, Math.round(rect.y * h));
          const sw = Math.max(16, Math.min(w - sx, Math.round(rect.w * w)));
          const sh = Math.max(16, Math.min(h - sy, Math.round(rect.h * h)));
          const canvas = document.createElement("canvas");
          canvas.width = sw;
          canvas.height = sh;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
          const croppedUrl = canvas.toDataURL("image/png");
          studio.cropMode = false;
          studio.undoStack = [];
          studio.redoStack = [];
          studio.zoom = 1.0;
          studio.fitBaseW = 0;
          await loadAndTranslateImage(croppedUrl, studio.filename, false);
        } catch (err) {
          studio.cropMode = false;
          studio.statusText = err.message;
          studio.statusErr = true;
          render();
        }
        resolve();
      };
      img.onerror = () => {
        studio.cropMode = false;
        render();
        resolve();
      };
      img.src = studio.imageDataUrl;
    });
  }

  async function loadAndTranslateImage(dataUrl, filename, skipCache = false) {
    if (!dataUrl) return;
    const isNewImage = studio.imageDataUrl !== dataUrl;
    studio.imageDataUrl = dataUrl;
    studio.filename = filename || studio.filename || "manga-page.png";
    if (isNewImage) {
      studio.bubbles = [];
      studio.selectedId = null;
      studio.zoom = 1.0;
      studio.fitBaseW = 0;
      studio.naturalW = 0;
      studio.naturalH = 0;
    }
    studio.cropMode = false;
    studio.undoStack = [];
    studio.redoStack = [];
    studio.showOriginal = false;
    studio.translating = true;
    studio.statusText = tr("st_translating");
    studio.statusErr = false;
    if (currentView !== "test") currentView = "test";
    render();

    try {
      const out = await callBridge("translateTestImage", {
        image_base64: dataUrl,
        model: studio.model,
        source_lang: studio.sourceLang,
        target_lang: studio.targetLang,
        vision: studio.vision,
        skip_cache: Boolean(skipCache),
      });
      const rawBubbles = Array.isArray(out.bubbles) ? out.bubbles : [];
      studio.bubbles = rawBubbles.map((b) => ({
        id: nextBubbleId++,
        x: Math.max(0, Math.min(0.96, Number(b.x) || 0)),
        y: Math.max(0, Math.min(0.96, Number(b.y) || 0)),
        w: Math.max(0.04, Math.min(1, Number(b.w) || 0.16)),
        h: Math.max(0.03, Math.min(1, Number(b.h) || 0.08)),
        text: String(b.text || ""),
        translated: String(b.fr || b.text || ""),
        style: ["bubble_light", "bubble_dark", "floating"].includes(b.style) ? b.style : "bubble_light",
        font: ["manga", "sans", "serif"].includes(b.font) ? b.font : "manga",
        align: ["left", "center", "right"].includes(b.align) ? b.align : "center",
        who: String(b.who || ""),
        fontScale: 1.0,
        manual: false,
        peek: false,
      }));
      studio.selectedId = studio.bubbles.length && studio.editMode ? studio.bubbles[0].id : null;
      studio.statusText = tr("st_done_meta")(
        studio.bubbles.length,
        out.model || studio.model,
        Boolean(out.vision_used),
        Boolean(out.cached),
        out.ocr_ms || 0,
        out.translate_ms || 0
      );
      studio.statusErr = false;
      if (sysState && !sysState.server_running) {
        sysState.server_running = true;
      }
    } catch (err) {
      studio.statusText = err.message;
      studio.statusErr = true;
    } finally {
      studio.translating = false;
    }
    render();
  }

  function wrapCanvasTextLines(ctx, rawText, maxWidth) {
    const paragraphs = String(rawText || "").split("\n");
    const lines = [];
    for (const para of paragraphs) {
      const trimmed = para.trim();
      if (!trimmed) {
        lines.push("");
        continue;
      }
      const words = trimmed.split(/\s+/);
      let current = words[0];
      for (let i = 1; i < words.length; i++) {
        const candidate = `${current} ${words[i]}`;
        if (ctx.measureText(candidate).width <= maxWidth) {
          current = candidate;
        } else {
          lines.push(current);
          current = words[i];
        }
      }
      lines.push(current);
    }
    return lines;
  }

  function exportStudioPng() {
    if (!studio.imageDataUrl) return Promise.resolve();
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = async () => {
        try {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);

          for (const b of studio.bubbles) {
            const bx = b.x * w;
            const by = b.y * h;
            const bw = b.w * w;
            const bh = b.h * h;
            const style = b.style || "bubble_light";
            const fontStack = STUDIO_FONTS[b.font] || STUDIO_FONTS.manga;
            const align = ["left", "center", "right"].includes(b.align) ? b.align : "center";
            const rawTxt = String(b.translated || b.text || "");
            const drawTxt = style === "floating" ? rawTxt.toUpperCase() : rawTxt;

            ctx.save();
            const rad = style === "floating" ? Math.max(8, Math.min(bw, bh) * 0.14) : Math.min(bw * 0.24, bh * 0.20);
            ctx.beginPath();
            ctx.moveTo(bx + rad, by);
            ctx.lineTo(bx + bw - rad, by);
            ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + rad);
            ctx.lineTo(bx + bw, by + bh - rad);
            ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - rad, by + bh);
            ctx.lineTo(bx + rad, by + bh);
            ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - rad);
            ctx.lineTo(bx, by + rad);
            ctx.quadraticCurveTo(bx, by, bx + rad, by);
            ctx.closePath();

            if (style === "bubble_dark") {
              ctx.shadowColor = "#141414";
              ctx.shadowBlur = Math.max(4, w * 0.004);
              ctx.fillStyle = "#141414";
            } else if (style === "floating") {
              ctx.shadowColor = "rgba(255, 255, 255, 0.72)";
              ctx.shadowBlur = Math.max(6, w * 0.005);
              ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
            } else {
              ctx.shadowColor = "#ffffff";
              ctx.shadowBlur = Math.max(4, w * 0.004);
              ctx.fillStyle = "#ffffff";
            }
            ctx.fill();
            ctx.restore();

            if (!drawTxt.trim()) continue;
            const padX = Math.max(4, bw * 0.06);
            const padY = Math.max(3, bh * 0.06);
            const innerW = Math.max(12, bw - padX * 2);
            const innerH = Math.max(12, bh - padY * 2);

            let size = Math.max(10, Math.min(bh * 0.48, Math.sqrt((bw * bh) / Math.max(drawTxt.length, 4)) * 1.15));
            let lines = [drawTxt];
            while (size > 8) {
              ctx.font = `700 ${size.toFixed(1)}px ${fontStack}`;
              lines = wrapCanvasTextLines(ctx, drawTxt, innerW);
              const widest = Math.max(...lines.map((l) => ctx.measureText(l).width), 0);
              const totalH = lines.length * size * 1.15;
              if (totalH <= innerH + 2 && widest <= innerW + 2) break;
              size -= Math.max(0.8, size * 0.06);
            }
            const finalSize = Math.max(8, Math.min(200, size * (b.fontScale || 1.0)));
            ctx.save();
            ctx.font = `700 ${finalSize.toFixed(1)}px ${fontStack}`;
            lines = wrapCanvasTextLines(ctx, drawTxt, innerW);
            ctx.textAlign = align;
            ctx.textBaseline = "middle";
            const tx = align === "left" ? (bx + padX) : (align === "right" ? (bx + bw - padX) : (bx + bw / 2));
            const lineH = finalSize * 1.14;
            const startY = by + bh / 2 - ((lines.length - 1) * lineH) / 2;
            lines.forEach((line, idx) => {
              const ly = startY + idx * lineH;
              if (style === "floating") {
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = Math.max(2, finalSize * 0.18);
                ctx.lineJoin = "round";
                ctx.strokeText(line, tx, ly);
              }
              ctx.fillStyle = style === "bubble_dark" ? "#f8f8f8" : "#111111";
              ctx.fillText(line, tx, ly);
            });
            ctx.restore();
          }

          const outDataUrl = canvas.toDataURL("image/png");
          const base = (studio.filename || "yomi-page").replace(/\.[^.]+$/, "");
          const r = await callBridge("saveExportedImage", {
            data_url: outDataUrl,
            suggested_name: `${base}-translated.png`,
          });
          if (r && r.saved && r.path) {
            studio.statusText = tr("st_exported")(r.path);
            studio.statusErr = false;
            render();
          }
        } catch (err) {
          studio.statusText = err.message;
          studio.statusErr = true;
          render();
        }
        resolve();
      };
      img.onerror = () => resolve();
      img.src = studio.imageDataUrl;
    });
  }

  function studioSidebarInnerHtml() {

    const modelOpts = models.map((m) => `<option value="${escHtml(m.id)}" ${m.id === studio.model ? "selected" : ""}>${escHtml(m.label || m.id)}</option>`).join("");
    const srcOpts = [
