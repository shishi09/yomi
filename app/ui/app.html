      { v: "de", l: "Deutsch" },
      { v: "it", l: "Italiano" },
      { v: "pt", l: "Português" },
    ].map((o) => `<option value="${o.v}" ${o.v === studio.targetLang ? "selected" : ""}>${o.l}</option>`).join("");
    const visOpts = [
      { v: "auto", l: tr("vis_auto") },
      { v: "on", l: tr("vis_on") },
      { v: "off", l: tr("vis_off") },
    ].map((o) => `<option value="${o.v}" ${o.v === studio.vision ? "selected" : ""}>${o.l}</option>`).join("");

    const hasImg = Boolean(studio.imageDataUrl);
    const tabsHtml = `
      <div id="st-side-tabs" class="studio-side-tabs">
        <button type="button" class="${studio.sideTab !== "bubbles" ? "on" : ""}" data-side-tab="translate">${ICONS.sliders}<span>${tr("st_tab_translate")}</span></button>
        <button type="button" class="${studio.sideTab === "bubbles" ? "on" : ""}" data-side-tab="bubbles">${ICONS.layers}<span>${tr("st_tab_bubbles")} (${studio.bubbles.length})</span></button>
      </div>
    `;

    if (studio.sideTab !== "bubbles") {
      const hintLine = hasImg ? (studio.editMode ? tr("st_hint_edit") : tr("st_hint_preview")) : "";
      return `
        ${tabsHtml}
        <div>
          <div class="insp-lbl">${tr("sum_engine")}</div>
          <select id="st-model" class="st-field-select">${modelOpts}</select>
        </div>
        <div>
          <div class="insp-lbl">${tr("sum_langs")}</div>
          <div class="st-lang-pair">
            <select id="st-src-lang" class="st-field-select">${srcOpts}</select>
            <span class="st-arrow">→</span>
            <select id="st-tgt-lang" class="st-field-select">${tgtOpts}</select>
          </div>
        </div>
        <div>
          <div class="insp-lbl">${tr("lbl_vis_mode")}</div>
          <select id="st-vision" class="st-field-select">${visOpts}</select>
        </div>
        <button id="st-btn-retranslate" type="button" class="pill-btn blue" style="width:100%;min-height:36px" ${!hasImg || studio.translating ? "disabled" : ""}>
          ${ICONS.refresh}<span>${tr("st_retranslate_full")}</span>
        </button>
        <div class="studio-meta-card">
          ${studio.statusText ? `<div class="${studio.statusErr ? "err" : ""}">${escHtml(studio.statusText)}</div>` : ""}
          ${hintLine ? `<div>${escHtml(hintLine)}</div>` : ""}
          <div style="border-top:1px solid var(--row-sep);padding-top:6px">
            <div class="insp-lbl" style="margin-bottom:5px">${tr("st_shortcuts_lbl")}</div>
            <div class="st-sc-grid">
              <span>${tr("st_sc_space")}</span>
              <span>${tr("st_sc_paste")}</span>
              <span>${tr("st_sc_zoom")}</span>
              <span>${tr("st_sc_undo")}</span>
            </div>
          </div>
        </div>
      `;
    }

    const headerHtml = `
      ${tabsHtml}
      <div class="insp-head">
        <span class="insp-title">${tr("st_insp_empty_t")}</span>
        <button id="st-btn-add-bubble" type="button" class="pill-btn sm" ${!hasImg ? "disabled" : ""}>${ICONS.plus}<span>${tr("st_add_bubble").replace(/^\+\s*/, "")}</span></button>
      </div>
    `;

    const selIdx = studio.bubbles.findIndex((b) => b.id === studio.selectedId);
    const sel = selIdx >= 0 ? studio.bubbles[selIdx] : null;
    if (!sel) {
      const listHtml = studio.bubbles.length
        ? `
          <div class="insp-list">
            ${studio.bubbles.map((b, i) => `
              <div class="insp-list-row">
                <button type="button" class="insp-list-item" data-insp-sel="${b.id}">
                  <span class="insp-list-txt">#${i + 1} · ${escHtml(b.translated || b.text || tr("st_new_bubble"))}</span>
                  <span class="bento-chev">›</span>
                </button>
                <button type="button" class="insp-del-ico" data-quick-del="${b.id}" title="${tr("st_insp_del")}">${ICONS.trash}</button>
              </div>
            `).join("")}
          </div>
        `
        : `<p class="row-sub" style="margin:0">${tr("st_no_bubbles")}</p>`;
      return `${headerHtml}<p class="row-sub" style="margin:0">${tr("st_insp_empty_d")}</p>${listHtml}`;
    }

    const scalePct = !sel.fontScale || Math.abs(sel.fontScale - 1.0) < 0.03
      ? tr("st_insp_auto")
      : `${Math.round(sel.fontScale * 100)}%`;
    const fontVal = sel.font || "manga";
    const alignVal = sel.align || "center";

    return `
      ${headerHtml}
      <div class="insp-nav-row">
        <button id="ed-back-list" type="button" class="pill-btn sm">${ICONS.arrowLeft}<span>${tr("st_back_list")}</span></button>
        <div class="insp-nav-step">
          <button id="ed-prev-bubble" type="button" class="zoom-ico-btn" ${studio.bubbles.length < 2 ? "disabled" : ""}>${ICONS.chevronLeft}</button>
          <span style="font-size:11.5px;font-weight:600;color:var(--muted);min-width:34px;text-align:center">${selIdx + 1} / ${studio.bubbles.length}</span>
          <button id="ed-next-bubble" type="button" class="zoom-ico-btn" ${studio.bubbles.length < 2 ? "disabled" : ""}>${ICONS.chevronRight}</button>
        </div>
      </div>
      <div>
        <div class="insp-lbl">${tr("st_insp_orig")}</div>
        <div class="insp-orig">${escHtml(sel.text || tr("st_manual_ocr"))}</div>
      </div>
      <div>
        <div class="insp-lbl">${tr("st_insp_tr")}</div>
        <textarea id="ed-bubble-text" class="insp-textarea" rows="4">${escHtml(sel.translated)}</textarea>
      </div>
      <div>
        <div class="insp-lbl">${tr("st_insp_font")}</div>
        <div id="ed-font-seg" class="seg-ctrl insp-seg-compact">
          <button type="button" class="seg-btn ${fontVal === "manga" ? "active" : ""}" data-ed-font="manga">${tr("st_font_manga")}</button>
          <button type="button" class="seg-btn ${fontVal === "sans" ? "active" : ""}" data-ed-font="sans">${tr("st_font_sans")}</button>
          <button type="button" class="seg-btn ${fontVal === "serif" ? "active" : ""}" data-ed-font="serif">${tr("st_font_serif")}</button>
        </div>
      </div>
      <div>
        <div class="insp-lbl">${tr("st_insp_align")}</div>
        <div id="ed-align-seg" class="seg-ctrl insp-seg-compact">
          <button type="button" class="seg-btn ${alignVal === "left" ? "active" : ""}" data-ed-align="left">${ICONS.alignLeft}</button>
          <button type="button" class="seg-btn ${alignVal === "center" ? "active" : ""}" data-ed-align="center">${ICONS.alignCenter}</button>
          <button type="button" class="seg-btn ${alignVal === "right" ? "active" : ""}" data-ed-align="right">${ICONS.alignRight}</button>
        </div>
      </div>
      <div>
        <div class="insp-lbl">${tr("st_insp_style")}</div>
        <div id="ed-style-seg" class="seg-ctrl insp-seg-compact">
          <button type="button" class="seg-btn ${sel.style === "bubble_light" ? "active" : ""}" data-ed-style="bubble_light">${tr("st_style_light")}</button>
          <button type="button" class="seg-btn ${sel.style === "bubble_dark" ? "active" : ""}" data-ed-style="bubble_dark">${tr("st_style_dark")}</button>
          <button type="button" class="seg-btn ${sel.style === "floating" ? "active" : ""}" data-ed-style="floating">${tr("st_style_float")}</button>
        </div>
      </div>
      <div>
        <div class="insp-lbl">${tr("st_insp_size")}</div>
        <div class="insp-size-row">
          <button id="ed-fs-minus" type="button" class="pill-btn sm">A−</button>
          <button id="ed-fs-auto" type="button" class="pill-btn sm">${scalePct}</button>
          <button id="ed-fs-plus" type="button" class="pill-btn sm">A+</button>
        </div>
      </div>
      <div style="margin-top:auto;padding-top:4px;display:flex;justify-content:flex-end">
        <button id="ed-btn-del" type="button" class="pill-btn danger sm">${ICONS.trash}<span>${tr("st_insp_del")}</span></button>
      </div>
    `;
  }

  function sectionStudioHtml() {
    const hasImg = Boolean(studio.imageDataUrl);
    const bubblesHtml = studio.cropMode
      ? ""
      : studio.bubbles.map((b) => {
          const isSel = studio.editMode && studio.selectedId === b.id;
          const cls = [
            "studio-bubble",
            `style-${b.style || "bubble_light"}`,
            `font-${b.font || "manga"}`,
            `align-${b.align || "center"}`,
            studio.editMode ? "is-edit" : "",
            isSel ? "selected" : "",
            !studio.editMode && b.peek ? "peek" : "",
          ].filter(Boolean).join(" ");
          const pos = `left:${(b.x * 100).toFixed(3)}%;top:${(b.y * 100).toFixed(3)}%;width:${(b.w * 100).toFixed(3)}%;height:${(b.h * 100).toFixed(3)}%;`;
          return `
            <div class="${cls}" data-bubble-id="${b.id}" style="${pos}">
              <span class="studio-bubble-txt">${escHtml(b.translated || b.text)}</span>
              ${isSel ? `<span class="bubble-resize-handle" data-resize-id="${b.id}"></span>` : ""}
            </div>
          `;
        }).join("");

    const cropBoxHtml = studio.cropMode
      ? (() => {
          const cr = studio.cropRect || { x: 0.12, y: 0.08, w: 0.76, h: 0.84 };
          return `
            <div id="studio-crop-box" class="crop-box" style="left:${(cr.x * 100).toFixed(2)}%;top:${(cr.y * 100).toFixed(2)}%;width:${(cr.w * 100).toFixed(2)}%;height:${(cr.h * 100).toFixed(2)}%">
              <span class="crop-grid-h" style="top:33.33%"></span>
              <span class="crop-grid-h" style="top:66.66%"></span>
              <span class="crop-grid-v" style="left:33.33%"></span>
              <span class="crop-grid-v" style="left:66.66%"></span>
              <span class="crop-handle nw" data-crop-handle="nw"></span>
              <span class="crop-handle ne" data-crop-handle="ne"></span>
              <span class="crop-handle sw" data-crop-handle="sw"></span>
              <span class="crop-handle se" data-crop-handle="se"></span>
            </div>
          `;
        })()
      : "";

    const imgZoomStyle = (studio.zoom !== 1.0 && studio.fitBaseW > 0 && !studio.cropMode)
      ? `width:${Math.round(studio.fitBaseW * studio.zoom)}px;max-width:none;max-height:none;`
      : "";

    return `
      <div class="studio-shell">
        <div class="studio-toolbar">
          <div class="studio-bar-grp">
            <button id="st-btn-pick" type="button" class="pill-btn">${ICONS.upload}<span>${hasImg ? tr("st_change") : tr("st_pick")}</span></button>
            <button id="st-btn-sample" type="button" class="pill-btn">${ICONS.sparkles}<span>${tr("st_sample")}</span></button>
            ${hasImg ? `<button id="st-btn-crop" type="button" class="pill-btn ${studio.cropMode ? "blue" : ""}">${ICONS.crop}<span>${tr("st_crop")}</span></button>` : ""}
          </div>

          ${hasImg ? `
            <div class="studio-bar-grp">
              <div id="st-mode-seg" class="studio-mode-seg">
                <button type="button" class="${!studio.editMode ? "on" : ""}" data-st-mode="preview">${tr("st_preview")}</button>
                <button type="button" class="${studio.editMode ? "on" : ""}" data-st-mode="edit">${ICONS.edit}<span>${tr("st_edit")}</span></button>
              </div>
              <button id="st-btn-toggle-orig" type="button" class="pill-btn">${ICONS.eye}<span>${studio.showOriginal ? tr("st_show_tr") : tr("st_show_orig")}</span></button>
              <button id="st-btn-undo" type="button" class="pill-btn" title="${tr("st_undo")}" ${!studio.undoStack.length ? "disabled" : ""}>${ICONS.undo}</button>
              <button id="st-btn-redo" type="button" class="pill-btn" title="${tr("st_redo")}" ${!studio.redoStack.length ? "disabled" : ""}>${ICONS.redo}</button>
            </div>
            <div class="studio-bar-grp">
              <button id="st-btn-export" type="button" class="pill-btn blue">${ICONS.download}<span>${tr("st_export")}</span></button>
            </div>
          ` : `<div></div>`}
        </div>

        <div class="studio-workspace">
          <div class="studio-canvas-col">
            ${studio.cropMode && hasImg ? `
              <div class="studio-crop-bar">
                <span style="font-size:12px;font-weight:500;color:var(--text);padding:0 4px">${tr("st_crop_hint")}</span>
                <button id="st-crop-cancel" type="button" class="pill-btn sm">${tr("st_crop_cancel")}</button>
                <button id="st-crop-apply" type="button" class="pill-btn blue sm">${tr("st_crop_apply")}</button>
              </div>
            ` : ""}

            <div id="studio-drop-pane" class="studio-stage-pane">
              ${hasImg ? `
                ${studio.translating ? `<div class="studio-loading"><span class="studio-spinner"></span><span>${tr("st_translating")}</span></div>` : ""}
                <div class="studio-stage-wrap">
                  <div id="studio-stage" class="studio-stage ${studio.showOriginal || spacePeekActive ? "hide-bubbles" : ""} ${studio.cropMode ? "is-crop" : ""}">
                    <img id="studio-img" src="${studio.imageDataUrl}" alt="${escHtml(studio.filename)}" style="${imgZoomStyle}" />
                    ${bubblesHtml}
                    ${cropBoxHtml}
                  </div>
                </div>
              ` : `
                <div class="studio-dropzone">
                  <div class="studio-drop-ico">${ICONS.image}</div>
                  <div class="studio-drop-title">${tr("st_drop_title")}</div>
                  <div class="studio-drop-sub">${tr("st_drop_sub")}</div>
                  <div class="studio-drop-actions">
                    <button id="st-btn-drop-pick" type="button" class="pill-btn blue">${ICONS.upload}<span>${tr("st_pick")}</span></button>
                    <button id="st-btn-drop-sample" type="button" class="pill-btn">${ICONS.sparkles}<span>${tr("st_sample")}</span></button>
                  </div>
                </div>
              `}
            </div>

            ${hasImg && !studio.cropMode ? `
              <div class="studio-zoom-bar">
                <button id="st-zoom-out" type="button" class="zoom-ico-btn" title="Zoom −">${ICONS.zoomOut}</button>
                <button id="st-zoom-pct" type="button" class="zoom-pct-btn">${Math.round(studio.zoom * 100)}%</button>
                <button id="st-zoom-in" type="button" class="zoom-ico-btn" title="Zoom +">${ICONS.zoomIn}</button>
                <button id="st-zoom-fit" type="button" class="pill-btn sm" style="min-height:24px;padding:2px 9px">${tr("st_fit")}</button>
              </div>
            ` : ""}
          </div>

          <aside id="studio-inspector" class="studio-sidebar">
            ${studioSidebarInnerHtml()}
          </aside>
        </div>
      </div>
    `;
  }

  function selectStudioBubble(bid, scrollIntoView = false) {
    studio.editMode = true;
    studio.sideTab = "bubbles";
    studio.showOriginal = false;
    studio.selectedId = bid;
    render();
    if (scrollIntoView) {
      const dom = document.querySelector(`.studio-bubble[data-bubble-id="${bid}"]`);
      if (dom && dom.scrollIntoView) {
        dom.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
      }
    }
  }

  function wireStudioSidebarEvents() {
    const insp = document.getElementById("studio-inspector");
    if (!insp) return;

    for (const tabBtn of insp.querySelectorAll("[data-side-tab]")) {
      tabBtn.addEventListener("click", () => {
        const nextTab = tabBtn.getAttribute("data-side-tab") === "bubbles" ? "bubbles" : "translate";
        if (studio.sideTab === nextTab) return;
        studio.sideTab = nextTab;
        refreshStudioInspector();
      });
    }

    const stModel = document.getElementById("st-model");
    if (stModel) stModel.addEventListener("change", () => { studio.model = stModel.value; });
    const stSrc = document.getElementById("st-src-lang");
    if (stSrc) stSrc.addEventListener("change", () => { studio.sourceLang = stSrc.value; });
    const stTgt = document.getElementById("st-tgt-lang");
    if (stTgt) stTgt.addEventListener("change", () => { studio.targetLang = stTgt.value; });
    const stVis = document.getElementById("st-vision");
    if (stVis) stVis.addEventListener("change", () => { studio.vision = stVis.value; });

    const btnRetranslate = document.getElementById("st-btn-retranslate");
    if (btnRetranslate) {
      btnRetranslate.addEventListener("click", () => {
        if (studio.imageDataUrl && !studio.translating) {
          loadAndTranslateImage(studio.imageDataUrl, studio.filename, true);
        }
      });
    }

    const btnAdd = document.getElementById("st-btn-add-bubble");
    if (btnAdd) {
      btnAdd.addEventListener("click", () => {
        pushStudioUndo(cloneStudioBubbles());
        const newId = nextBubbleId++;
        studio.bubbles.push({
          id: newId,
          x: 0.34,
          y: 0.38,
          w: 0.30,
          h: 0.14,
          text: "",
          translated: tr("st_new_bubble"),
          style: "bubble_light",
          font: "manga",
          align: "center",
          who: "",
          fontScale: 1.0,
          manual: true,
          peek: false,
        });
        studio.editMode = true;
        studio.sideTab = "bubbles";
        studio.showOriginal = false;
        studio.selectedId = newId;
        render();
        const area = document.getElementById("ed-bubble-text");
        if (area) {
          area.focus();
          area.select();
        }
      });
    }

    for (const item of insp.querySelectorAll("[data-insp-sel]")) {
      item.addEventListener("click", () => {
        const bid = Number(item.getAttribute("data-insp-sel"));
        selectStudioBubble(bid, true);
      });
    }

    for (const delBtn of insp.querySelectorAll("[data-quick-del]")) {
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const bid = Number(delBtn.getAttribute("data-quick-del"));
        pushStudioUndo(cloneStudioBubbles());
        studio.bubbles = studio.bubbles.filter((b) => b.id !== bid);
        if (studio.selectedId === bid) studio.selectedId = null;
        render();
      });
    }

    const selIdx = studio.bubbles.findIndex((b) => b.id === studio.selectedId);
    const sel = selIdx >= 0 ? studio.bubbles[selIdx] : null;
    if (!sel) return;

    const btnBackList = document.getElementById("ed-back-list");
    if (btnBackList) {
      btnBackList.addEventListener("click", () => {
        studio.selectedId = null;
        syncStageSelectionDom();
        refreshStudioInspector();
      });
    }

    const btnPrevB = document.getElementById("ed-prev-bubble");
    if (btnPrevB && studio.bubbles.length >= 2) {
      btnPrevB.addEventListener("click", () => {
        const prevIdx = (selIdx - 1 + studio.bubbles.length) % studio.bubbles.length;
        selectStudioBubble(studio.bubbles[prevIdx].id, true);
      });
    }
    const btnNextB = document.getElementById("ed-next-bubble");
    if (btnNextB && studio.bubbles.length >= 2) {
      btnNextB.addEventListener("click", () => {
        const nextIdx = (selIdx + 1) % studio.bubbles.length;
        selectStudioBubble(studio.bubbles[nextIdx].id, true);
      });
    }

    const area = document.getElementById("ed-bubble-text");
    if (area) {
      area.addEventListener("focus", () => { editTextUndoArmed = true; });
      area.addEventListener("input", () => {
        if (editTextUndoArmed) {
          pushStudioUndo(cloneStudioBubbles());
          editTextUndoArmed = false;
        }
        sel.translated = area.value;
        const dom = document.querySelector(`.studio-bubble[data-bubble-id="${sel.id}"]`);
        if (dom) {
          const span = dom.querySelector(".studio-bubble-txt");
          if (span) span.textContent = sel.translated;
          fitStudioBubbleFont(dom, sel);
        }
      });
    }

    for (const fbtn of insp.querySelectorAll("[data-ed-font]")) {
      fbtn.addEventListener("click", () => {
        const font = fbtn.getAttribute("data-ed-font");
        if (!["manga", "sans", "serif"].includes(font) || sel.font === font) return;
        pushStudioUndo(cloneStudioBubbles());
        sel.font = font;
        for (const other of insp.querySelectorAll("[data-ed-font]")) {
          other.classList.toggle("active", other === fbtn);
        }
        const dom = document.querySelector(`.studio-bubble[data-bubble-id="${sel.id}"]`);
        if (dom) {
          dom.classList.remove("font-manga", "font-sans", "font-serif");
          dom.classList.add(`font-${font}`);
          fitStudioBubbleFont(dom, sel);
        }
      });
    }

    for (const abtn of insp.querySelectorAll("[data-ed-align]")) {
      abtn.addEventListener("click", () => {
        const align = abtn.getAttribute("data-ed-align");
        if (!["left", "center", "right"].includes(align) || sel.align === align) return;
        pushStudioUndo(cloneStudioBubbles());
        sel.align = align;
        for (const other of insp.querySelectorAll("[data-ed-align]")) {
          other.classList.toggle("active", other === abtn);
        }
        const dom = document.querySelector(`.studio-bubble[data-bubble-id="${sel.id}"]`);
        if (dom) {
          dom.classList.remove("align-left", "align-center", "align-right");
          dom.classList.add(`align-${align}`);
        }
      });
    }

    for (const sbtn of insp.querySelectorAll("[data-ed-style]")) {
      sbtn.addEventListener("click", () => {
        const style = sbtn.getAttribute("data-ed-style");
        if (!["bubble_light", "bubble_dark", "floating"].includes(style) || sel.style === style) return;
        pushStudioUndo(cloneStudioBubbles());
        sel.style = style;
        for (const other of insp.querySelectorAll("[data-ed-style]")) {
          other.classList.toggle("active", other === sbtn);
        }
        const dom = document.querySelector(`.studio-bubble[data-bubble-id="${sel.id}"]`);
        if (dom) {
          dom.classList.remove("style-bubble_light", "style-bubble_dark", "style-floating");
          dom.classList.add(`style-${style}`);
        }
      });
    }

    const updateFontScale = (nextScale) => {
      pushStudioUndo(cloneStudioBubbles());
      sel.fontScale = nextScale;
      const dom = document.querySelector(`.studio-bubble[data-bubble-id="${sel.id}"]`);
      if (dom) fitStudioBubbleFont(dom, sel);
      const autoBtn = document.getElementById("ed-fs-auto");
      if (autoBtn) {
        autoBtn.textContent = Math.abs(sel.fontScale - 1.0) < 0.03
          ? tr("st_insp_auto")
          : `${Math.round(sel.fontScale * 100)}%`;
      }
    };
    const btnMinus = document.getElementById("ed-fs-minus");
    const btnAuto = document.getElementById("ed-fs-auto");
    const btnPlus = document.getElementById("ed-fs-plus");
    if (btnMinus) btnMinus.addEventListener("click", () => updateFontScale(Math.max(0.55, +((sel.fontScale || 1.0) - 0.12).toFixed(2))));
    if (btnAuto) btnAuto.addEventListener("click", () => updateFontScale(1.0));
    if (btnPlus) btnPlus.addEventListener("click", () => updateFontScale(Math.min(2.2, +((sel.fontScale || 1.0) + 0.12).toFixed(2))));

    const btnDel = document.getElementById("ed-btn-del");
    if (btnDel) {
      btnDel.addEventListener("click", () => {
        pushStudioUndo(cloneStudioBubbles());
        studio.bubbles = studio.bubbles.filter((b) => b.id !== sel.id);
        studio.selectedId = null;
        render();
      });
    }
  }

  function syncStageSelectionDom() {
    for (const dom of document.querySelectorAll(".studio-bubble[data-bubble-id]")) {
      const bid = Number(dom.getAttribute("data-bubble-id"));
      const isSel = studio.editMode && bid === studio.selectedId;
      dom.classList.toggle("selected", isSel);
      const existingHandle = dom.querySelector(".bubble-resize-handle");
      if (isSel && !existingHandle) {
        const h = document.createElement("span");
        h.className = "bubble-resize-handle";
        h.setAttribute("data-resize-id", String(bid));
        dom.appendChild(h);
      } else if (!isSel && existingHandle) {
        existingHandle.remove();
      }
    }
  }

  function refreshStudioInspector() {
    const insp = document.getElementById("studio-inspector");
    if (!insp) return;
    insp.innerHTML = studioSidebarInnerHtml();
    wireStudioSidebarEvents();
  }

  function wireStudioEvents() {
    const pickAction = async () => {
      try {
        const r = await callBridge("pickTestImage");
        if (r && !r.cancelled && r.data_url) {
          await loadAndTranslateImage(r.data_url, r.filename || "manga-page.png", false);
        }
      } catch (err) {
        studio.statusText = err.message;
        studio.statusErr = true;
        render();
      }
    };
    const sampleAction = () => {
      const sampleUrl = generateSampleMangaDataUrl(studio.sourceLang);
      loadAndTranslateImage(sampleUrl, "sample-manga.png", false);
    };

    for (const id of ["st-btn-pick", "st-btn-drop-pick"]) {
      const btn = document.getElementById(id);
      if (btn) btn.addEventListener("click", pickAction);
    }
    for (const id of ["st-btn-sample", "st-btn-drop-sample"]) {
      const btn = document.getElementById(id);
      if (btn) btn.addEventListener("click", sampleAction);
    }

    const btnCrop = document.getElementById("st-btn-crop");
    if (btnCrop) {
      btnCrop.addEventListener("click", () => {
        if (studio.cropMode) {
          studio.cropMode = false;
          render();
        } else {
          enterCropMode();
        }
      });
    }
    const btnCropCancel = document.getElementById("st-crop-cancel");
    if (btnCropCancel) {
      btnCropCancel.addEventListener("click", () => {
        studio.cropMode = false;
        render();
      });
    }
    const btnCropApply = document.getElementById("st-crop-apply");
    if (btnCropApply) {
      btnCropApply.addEventListener("click", () => applyCropAndTranslate());
    }

    const btnUndo = document.getElementById("st-btn-undo");
    if (btnUndo) btnUndo.addEventListener("click", () => undoStudio());
    const btnRedo = document.getElementById("st-btn-redo");
    if (btnRedo) btnRedo.addEventListener("click", () => redoStudio());

    const btnToggleOrig = document.getElementById("st-btn-toggle-orig");
    if (btnToggleOrig) {
      btnToggleOrig.addEventListener("click", () => {
        studio.showOriginal = !studio.showOriginal;
        const stg = document.getElementById("studio-stage");
        if (stg) stg.classList.toggle("hide-bubbles", studio.showOriginal || spacePeekActive);
        const span = btnToggleOrig.querySelector("span");
        if (span) span.textContent = studio.showOriginal ? tr("st_show_tr") : tr("st_show_orig");
      });
    }

    for (const mBtn of document.querySelectorAll("#st-mode-seg [data-st-mode]")) {
      mBtn.addEventListener("click", () => {
        const nextEdit = mBtn.getAttribute("data-st-mode") === "edit";
        if (studio.editMode === nextEdit) return;
        studio.editMode = nextEdit;
        if (studio.editMode) {
          studio.showOriginal = false;
          studio.sideTab = "bubbles";
        }
        render();
      });
    }

    const btnExport = document.getElementById("st-btn-export");
    if (btnExport) {
      btnExport.addEventListener("click", () => exportStudioPng());
    }

    const btnZoomOut = document.getElementById("st-zoom-out");
    const btnZoomPct = document.getElementById("st-zoom-pct");
    const btnZoomIn = document.getElementById("st-zoom-in");
    const btnZoomFit = document.getElementById("st-zoom-fit");
    if (btnZoomOut) btnZoomOut.addEventListener("click", () => setStudioZoom(studio.zoom - 0.25));
    if (btnZoomPct) btnZoomPct.addEventListener("click", () => setStudioZoom(1.0));
    if (btnZoomIn) btnZoomIn.addEventListener("click", () => setStudioZoom(studio.zoom + 0.25));
    if (btnZoomFit) btnZoomFit.addEventListener("click", () => setStudioZoom(1.0));

    const studioImg = document.getElementById("studio-img");
    if (studioImg) {
      studioImg.onload = () => {
        studio.naturalW = studioImg.naturalWidth || 0;
        studio.naturalH = studioImg.naturalHeight || 0;
        studio.fitBaseW = 0;
        applyStudioZoom();
      };
      if (studioImg.complete && studioImg.naturalWidth) {
        studio.naturalW = studioImg.naturalWidth;
        studio.naturalH = studioImg.naturalHeight;
      }
    }

    const cropBox = document.getElementById("studio-crop-box");
    if (cropBox) {
      cropBox.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const stage = document.getElementById("studio-stage");
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const hEl = e.target.closest("[data-crop-handle]");
        const mode = hEl ? hEl.getAttribute("data-crop-handle") : "move";
        studioCropDrag = {
          mode,
          startX: e.clientX,
          startY: e.clientY,
          orig: { ...studio.cropRect },
          stageW: rect.width,
          stageH: rect.height,
          el: cropBox,
        };
      });
    }

    const stagePane = document.getElementById("studio-drop-pane");
    if (stagePane) {
      stagePane.addEventListener("dragover", (e) => {
        e.preventDefault();
        stagePane.classList.add("drag-over");
      });
      stagePane.addEventListener("dragleave", (e) => {
        if (!stagePane.contains(e.relatedTarget)) {
          stagePane.classList.remove("drag-over");
        }
      });
      stagePane.addEventListener("drop", (e) => {
        e.preventDefault();
        stagePane.classList.remove("drag-over");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.type && file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = () => loadAndTranslateImage(reader.result, file.name, false);
          reader.readAsDataURL(file);
        }
      });
      stagePane.addEventListener("pointerdown", (e) => {
        if (studio.editMode && !studio.cropMode && !e.target.closest(".studio-bubble") && studio.selectedId !== null) {
          studio.selectedId = null;
          syncStageSelectionDom();
          refreshStudioInspector();
        }
      });
    }

    for (const bEl of document.querySelectorAll(".studio-bubble[data-bubble-id]")) {
      bEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const bid = Number(bEl.getAttribute("data-bubble-id"));
        const bubble = studio.bubbles.find((item) => item.id === bid);
        if (!bubble) return;

        if (!studio.editMode) {
          bubble.peek = !bubble.peek;
          bEl.classList.toggle("peek", bubble.peek);
          return;
        }

        const isResize = Boolean(e.target.closest(".bubble-resize-handle"));
        if (studio.selectedId !== bid || studio.sideTab !== "bubbles") {
          studio.selectedId = bid;
          studio.sideTab = "bubbles";
          syncStageSelectionDom();
          refreshStudioInspector();
        }

        const stage = document.getElementById("studio-stage");
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        studioDrag = {
          id: bid,
          mode: isResize ? "resize" : "move",
          startX: e.clientX,
          startY: e.clientY,
          origX: bubble.x,
          origY: bubble.y,
          origW: bubble.w,
          origH: bubble.h,
          stageW: rect.width,
          stageH: rect.height,
          el: bEl,
          preSnapshot: cloneStudioBubbles(),
          pushedUndo: false,
        };
      });
    }

    wireStudioSidebarEvents();
    requestAnimationFrame(() => applyStudioZoom());
  }

      } else if (settingsTab === "browser") {
        settingsHtml += sectionBrowserHtml();
      } else if (settingsTab === "storage") {

      } else if (settingsTab === "about") {
        settingsHtml += `
          <div class="sec-title">${tr("sec_sys")}</div>

            <div class="group-row">
              <div class="row-left"><div class="row-title">Yomi</div></div>
              <div class="row-right"><span style="color:var(--muted)">${tr("ver")} 2.1.0 (Apple Silicon)</span></div>

            <div class="group-row">
              <div class="row-left"><div class="row-title">${tr("lbl_chip")}</div></div>
              <div class="row-right"><span style="color:var(--muted)">${sysState.chip} · ${sysState.ram_gb} Go</span></div>
            </div>
            <div class="group-row">
              <div class="row-left"><div class="row-title">macOS</div></div>
              <div class="row-right"><span style="color:var(--muted)">${sysState.macos}</span></div>
            </div>
            <div class="group-row">
              <div class="row-left"><div class="row-title">Data</div></div>
              <div class="row-right"><span style="color:var(--muted);font-size:11px">${sysState.data_dir}</span></div>
            </div>

          <div class="group-card">
            <div class="group-row">

            <div class="group-row">

                <div class="row-title">${tr("fb_feat_t")}</div>
                <div class="row-sub">${tr("fb_feat_d")}</div>

    if (bannerMsg) {
      html += `<div class="banner show ${bannerMsg.ok ? "ok" : "err"}">${bannerMsg.text}</div>`;
    }
    bodyEl.innerHTML = html;
    wireContentEvents();
    if (document.querySelectorAll("[data-cat-slot]").length) {
      syncCatAnimation();
    } else if (catTimer) {
      clearInterval(catTimer);
      catTimer = null;
    }
  }

  function persistSetting(updates) {
    if (currentView !== "wizard") {
      callBridge("saveSettings", updates).then((s) => { sysState = s; }).catch(() => {});
    }
  }

  function wireContentEvents() {
    const btnCat = document.getElementById("btn-cat-stage");
    if (btnCat) {
      btnCat.addEventListener("click", () => triggerCatSpin(3680, "main"));
    }

    for (const card of document.querySelectorAll("[data-pick-cat]")) {
      card.addEventListener("click", () => {
        selectedMascot = card.getAttribute("data-pick-cat") || "mochi";
        applyMascotTheme(selectedMascot);
        spinUntilMap.set(selectedMascot, Date.now() + 3680);
        render();
      });
    }

    for (const card of document.querySelectorAll("[data-pick-theme]")) {
      card.addEventListener("click", () => {
        applyTheme(card.getAttribute("data-pick-theme"));
        callBridge("setTheme", { theme: currentTheme }).catch(() => {});
        render();
      });
    }

    const btnAutoTools = document.getElementById("btn-auto-tools");
    if (btnAutoTools) {
      btnAutoTools.addEventListener("click", async () => {
        btnAutoTools.disabled = true;
        isBusy = true;
        render();
        try {
          if (!sysState?.python?.installed) {
            sysState = await callBridge("installPython");
            delete progressState.python;
          }
          if (form.engine_mode !== "api") {
            if (!sysState?.ollama?.installed) {
              sysState = await callBridge("installOllama");
              delete progressState.ollama;
            } else if (!sysState?.ollama?.running) {
              sysState = await callBridge("startOllama");
            }
          }
        } catch (err) {
          delete progressState.python;
          delete progressState.ollama;
          bannerMsg = { ok: false, text: err.message };
        } finally {
          isBusy = false;
        }
        render();
      });
    }

    for (const segBtn of document.querySelectorAll("#sel-vision-seg [data-vis]")) {
      segBtn.addEventListener("click", () => {
        form.vision_mode = segBtn.getAttribute("data-vis") || "auto";
        render();
      });
    }

    for (const brBtn of document.querySelectorAll("#br-tab-seg [data-br]")) {
      brBtn.addEventListener("click", () => {
        wizardBrowserTab = brBtn.getAttribute("data-br") || "safari";
        render();
      });
    }

    const selLang = document.getElementById("sel-ui-lang");
    if (selLang) {
      selLang.addEventListener("change", () => {
        uiLang = selLang.value === "en" ? "en" : "fr";
        if (currentView !== "wizard") callBridge("saveSettings", { ui_lang: uiLang }).catch(() => {});
        render();
      });
    }

    const selTheme = document.getElementById("sel-theme");
    if (selTheme) {
      selTheme.addEventListener("change", () => {
        applyTheme(selTheme.value);
        callBridge("setTheme", { theme: currentTheme }).catch(() => {});
        renderSidebar();
      });
    }

    for (const tabBtn of document.querySelectorAll("[data-settings-tab]")) {
      tabBtn.addEventListener("click", () => {
        bannerMsg = null;
        settingsTab = tabBtn.getAttribute("data-settings-tab") || "general";
        render();
      });
    }

    const selMascot = document.getElementById("sel-mascot");
    if (selMascot) {
      selMascot.addEventListener("change", () => {
        selectedMascot = ["mochi", "kuro", "sakura"].includes(selMascot.value) ? selMascot.value : "mochi";
        applyMascotTheme(selectedMascot);
        persistSetting({ mascot: selectedMascot });
        render();
      });
    }

    const btnPy = document.getElementById("btn-inst-py");
    if (btnPy) {
      btnPy.addEventListener("click", async () => {
        btnPy.disabled = true;
        try {
          sysState = await callBridge("installPython");
          delete progressState.python;
          render();
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
          render();
        }
      });
    }

    const btnOl = document.getElementById("btn-inst-ol");
    if (btnOl) {
      btnOl.addEventListener("click", async () => {
        btnOl.disabled = true;
        try {
          sysState = sysState?.ollama?.installed && !sysState?.ollama?.running
            ? await callBridge("startOllama")
            : await callBridge("installOllama");
          delete progressState.ollama;
          render();
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
          render();
        }
      });
    }

    for (const row of document.querySelectorAll("[data-pick-mode]")) {
      row.addEventListener("click", () => {
        form.engine_mode = row.getAttribute("data-pick-mode");
        const modelStr = form.engine_mode === "api" ? formattedCloudModelId() : `ollama:${form.local_model}`;
        persistSetting({ engine_mode: form.engine_mode, default_model: modelStr });
        render();
      });
    }

    for (const b of document.querySelectorAll(".btn-sel-mod")) {
      b.addEventListener("click", () => {
        form.local_model = b.getAttribute("data-m");
        persistSetting({ default_model: `ollama:${form.local_model}` });
        render();
      });
    }

    for (const b of document.querySelectorAll(".btn-dl-mod")) {
      b.addEventListener("click", async () => {
        const model = b.getAttribute("data-m");
        form.local_model = model;
        isBusy = true;
        render();
        try {
          sysState = await callBridge("pullModel", { model });
          delete progressState.pull;
          bannerMsg = { ok: true, text: `${model} ${tr("installed").toLowerCase()}.` };
        } catch (err) {
          delete progressState.pull;
          bannerMsg = { ok: false, text: err.message };
        } finally {
          isBusy = false;
        }
        render();
      });
    }

    const cancelPull = document.getElementById("btn-cancel-pull");
    if (cancelPull) {
      cancelPull.addEventListener("click", () => {
        callBridge("cancelPull");
        delete progressState.pull;
        render();
      });
    }

    const selApiProv = document.getElementById("sel-api-provider");
    if (selApiProv) {
      selApiProv.addEventListener("change", () => {
        form.api_provider = selApiProv.value || "gemini";
        const pinfo = getProviderInfo(form.api_provider);
        form.api_base_url = "";
        customBaseUrlOpen = form.api_provider === "custom";
        customModelOpen = form.api_provider === "custom";
        form.api_model = (pinfo.models[0] && pinfo.models[0].v) || "";
        apiKeyDraft = "";
        bannerMsg = null;
        const updates = {
          api_provider: form.api_provider,
          api_base_url: "",
          api_model: form.api_model,
        };
        if (form.engine_mode === "api") updates.default_model = formattedCloudModelId();
        persistSetting(updates);
        render();
      });
    }

    const btnToggleBaseUrl = document.getElementById("btn-toggle-base-url");
    if (btnToggleBaseUrl) {
      btnToggleBaseUrl.addEventListener("click", () => {
        customBaseUrlOpen = !customBaseUrlOpen;
        render();
      });
    }

    const inpKey = document.getElementById("inp-api-key");
    if (inpKey) {
      inpKey.addEventListener("input", () => { apiKeyDraft = inpKey.value; });
    }

    const inpApiBaseUrl = document.getElementById("inp-api-base-url");
    if (inpApiBaseUrl) {
      inpApiBaseUrl.addEventListener("input", () => { form.api_base_url = inpApiBaseUrl.value.trim(); });
      inpApiBaseUrl.addEventListener("change", () => {
        form.api_base_url = inpApiBaseUrl.value.trim();
        persistSetting({ api_base_url: form.api_base_url });
      });
    }

    const btnTestKey = document.getElementById("btn-test-key");
    if (btnTestKey) {
      btnTestKey.addEventListener("click", async () => {
        btnTestKey.disabled = true;
        try {
          await callBridge("testApiKey", {
            provider: form.api_provider,
            key: apiKeyDraft.trim(),
            base_url: (form.api_base_url || "").trim(),
            model: (form.api_model || "").trim(),
          });
          const label = getProviderInfo(form.api_provider).label;
          bannerMsg = { ok: true, text: uiLang === "en" ? `${label} API key is valid!` : `Clé API ${label} valide !` };
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
        }
        render();
      });
    }

    const btnSaveKey = document.getElementById("btn-save-key");
    if (btnSaveKey) {
      btnSaveKey.addEventListener("click", async () => {
        const updates = {
          api_provider: form.api_provider,
          api_base_url: (form.api_base_url || "").trim(),
          api_model: (form.api_model || "").trim(),
        };
        if (apiKeyDraft.trim()) updates.api_key = apiKeyDraft.trim();
        if (form.engine_mode === "api") updates.default_model = formattedCloudModelId();
        sysState = await callBridge("saveSettings", updates);
        apiKeyDraft = "";
        bannerMsg = { ok: true, text: tr("saved_toast") };
        render();
      });
    }

    const selApiMod = document.getElementById("sel-api-mod");
    if (selApiMod) {
      selApiMod.addEventListener("change", () => {
        if (selApiMod.value === "__custom__") {
          customModelOpen = true;
          render();
          const inp = document.getElementById("inp-api-model");
          if (inp) inp.focus();
          return;
        }
        customModelOpen = false;
        form.api_model = selApiMod.value;
        const updates = { api_model: form.api_model };
        if (form.engine_mode === "api") updates.default_model = formattedCloudModelId();
        persistSetting(updates);
        render();
      });
    }

    const inpApiModel = document.getElementById("inp-api-model");
    if (inpApiModel) {
      inpApiModel.addEventListener("input", () => { form.api_model = inpApiModel.value.trim(); });
      inpApiModel.addEventListener("change", () => {
        form.api_model = inpApiModel.value.trim();
        const updates = { api_model: form.api_model };
        if (form.engine_mode === "api") updates.default_model = formattedCloudModelId();
        persistSetting(updates);
      });
    }

    const selSrc = document.getElementById("sel-src-lang");
    if (selSrc) {
      selSrc.addEventListener("change", () => {
        form.source_lang = selSrc.value;
        persistSetting({ source_lang: form.source_lang });
      });
    }
    const selTgt = document.getElementById("sel-tgt-lang");
    if (selTgt) {
      selTgt.addEventListener("change", () => {
        form.target_lang = selTgt.value;
        persistSetting({ target_lang: form.target_lang });
      });
    }
    const selVis = document.getElementById("sel-vision-mode");
    if (selVis) {
      selVis.addEventListener("change", () => {
        form.vision_mode = selVis.value;
        persistSetting({ vision_mode: form.vision_mode });
      });
    }

    const btnAutoUs = document.getElementById("btn-auto-us");
    if (btnAutoUs) {
      btnAutoUs.addEventListener("click", async () => {
        btnAutoUs.disabled = true;
        try {
          const r = await callBridge("autoInstallSafariUserscript");
          if (r.state) sysState = r.state;
          if (!r.cancelled && r.path) {
            bannerMsg = { ok: true, text: r.auto ? tr("us_auto_ok")(r.path) : r.path };
          }
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
        }
        render();
      });
    }

    const btnInstUs = document.getElementById("btn-inst-us");
    if (btnInstUs) {
      btnInstUs.addEventListener("click", async () => {
        try {
          const r = await callBridge("installUserscriptToFolder");
          if (r.state) sysState = r.state;
          if (!r.cancelled && r.path) {
            bannerMsg = { ok: true, text: r.path };
            render();
          }
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
          render();
        }
      });
    }

    const btnOpenUsUrl = document.getElementById("btn-open-us-url");
    if (btnOpenUsUrl) {
      btnOpenUsUrl.addEventListener("click", async () => {
        btnOpenUsUrl.disabled = true;
        try {
          const r = await callBridge("openUserscriptInstallUrl");
          if (r.state) sysState = r.state;
          bannerMsg = { ok: true, text: tr("us_url_ok") };
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
        }
        render();
      });
    }

    const btnGetUsApp = document.getElementById("btn-get-us-app");
    if (btnGetUsApp) {
      btnGetUsApp.addEventListener("click", () => {
        callBridge("openUserscriptsAppStore").catch(() => {});
      });
    }

    const btnHomeScript = document.getElementById("btn-home-script");
    if (btnHomeScript) {
      btnHomeScript.addEventListener("click", async () => {
        if (sysState?.userscripts?.detected_dir) {
          btnHomeScript.disabled = true;
          try {
            const r = await callBridge("autoInstallSafariUserscript");
            if (r.state) sysState = r.state;
            if (!r.cancelled && r.path) {
              bannerMsg = { ok: true, text: tr("us_auto_ok")(r.path) };
            }
          } catch (err) {
            bannerMsg = { ok: false, text: err.message };
          }
          render();
        } else {
          currentView = "settings";
          settingsTab = "browser";
          bannerMsg = null;
          render();
        }
      });
    }

    const btnCopyUs = document.getElementById("btn-copy-us");
    if (btnCopyUs) {
      btnCopyUs.addEventListener("click", async () => {
        try {
          await callBridge("copyUserscript");
          bannerMsg = { ok: true, text: uiLang === "en" ? "Script copied to clipboard!" : "Script copié dans le presse-papiers !" };
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
        }
        render();
      });
    }

    const btnStart = document.getElementById("btn-start-srv");
    if (btnStart) {
      btnStart.addEventListener("click", async () => {
        btnStart.disabled = true;
        isBusy = true;
        syncCatAnimation();
        try {
          sysState = await callBridge("startServer");
          bannerMsg = sysState.server_running ? null : { ok: false, text: uiLang === "en" ? "Server failed to start (check Settings → General)." : "Le serveur n'a pas démarré (vérifiez Réglages → Général)." };
        } finally {
          isBusy = false;
        }
        render();
      });
    }
    const btnStop = document.getElementById("btn-stop-srv");
    if (btnStop) {
      btnStop.addEventListener("click", async () => {
        btnStop.disabled = true;
        sysState = await callBridge("stopServer");
        bannerMsg = null;
        render();
      });
    }
    const btnRestart = document.getElementById("btn-restart-srv");
    if (btnRestart) {
      btnRestart.addEventListener("click", async () => {
        btnRestart.disabled = true;
        isBusy = true;
        syncCatAnimation();
        try {
          sysState = await callBridge("restartServer");
          bannerMsg = { ok: sysState.server_running, text: sysState.server_running ? tr("srv_on") : tr("srv_off") };
        } finally {
          isBusy = false;
        }
        render();
      });
    }
    const btnGoSettings = document.getElementById("btn-go-settings");
    if (btnGoSettings) {
      btnGoSettings.addEventListener("click", () => {
        currentView = "settings";
        settingsTab = "general";
        bannerMsg = null;
        render();
      });

    for (const row of document.querySelectorAll("[data-open-tab]")) {

        bannerMsg = null;

    for (const [id, getUrl] of [
      ["btn-feedback-bug", () => buildBugReportUrl()],
      ["btn-feedback-feature", () => `${YOMI_REPO_URL}/issues/new?template=feature_request.md`],
      ["btn-feedback-discussions", () => `${YOMI_REPO_URL}/discussions`],
      ["btn-feedback-repo", () => YOMI_REPO_URL],
    ]) {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener("click", () => {
          callBridge("openExternalUrl", { url: getUrl() }).catch((err) => {
            bannerMsg = { ok: false, text: err.message };
            render();
          });
        });
      }
    }
    const btnOpenTest = document.getElementById("btn-open-test");
    if (btnOpenTest) {
      btnOpenTest.addEventListener("click", (e) => {
        e.stopPropagation();
        openStudioView();
      });
    }

    const btnHomePick = document.getElementById("btn-home-pick");
    if (btnHomePick) {
      btnHomePick.addEventListener("click", async (e) => {
        e.stopPropagation();
        ensureStudioDefaults();
        try {
          const r = await callBridge("pickTestImage");
          if (r && !r.cancelled && r.data_url) {
            await loadAndTranslateImage(r.data_url, r.filename || "manga-page.png", false);
          }
        } catch (err) {
          bannerMsg = { ok: false, text: err.message };
          render();
        }
      });
    }

    const cardHomeStudio = document.getElementById("card-home-studio");
    if (cardHomeStudio) {
      cardHomeStudio.addEventListener("click", (e) => {
        if (!e.target.closest("button")) openStudioView();
      });
      cardHomeStudio.addEventListener("dragover", (e) => {
        e.preventDefault();
        cardHomeStudio.classList.add("drag-over");
      });
      cardHomeStudio.addEventListener("dragleave", (e) => {
        if (!cardHomeStudio.contains(e.relatedTarget)) {
          cardHomeStudio.classList.remove("drag-over");
        }
      });
      cardHomeStudio.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        cardHomeStudio.classList.remove("drag-over");
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.type && file.type.startsWith("image/")) {
          ensureStudioDefaults();
          const reader = new FileReader();
          reader.onload = () => loadAndTranslateImage(reader.result, file.name, false);
          reader.readAsDataURL(file);
        }
      });
    }

    wireStudioEvents();

    const btnRunWiz = document.getElementById("btn-run-wiz");
    if (btnRunWiz) {
      btnRunWiz.addEventListener("click", () => {
        currentView = "wizard";
        wizardStep = 1;
        bannerMsg = null;
        render();
      });
    }

    const btnUnload = document.getElementById("btn-unload-ram");
    if (btnUnload) {
      btnUnload.addEventListener("click", async () => {
        const r = await callBridge("unloadRam");
        bannerMsg = { ok: true, text: `RAM OK (${(r.unloaded || []).join(", ") || "0"})` };
        render();
      });
    }

    const btnClear = document.getElementById("btn-clear-cache");
    if (btnClear) {
      btnClear.addEventListener("click", async () => {
        const r = await callBridge("clearCache");
        bannerMsg = { ok: true, text: `${r.deleted || 0} cache files removed.` };
        render();
      });
    }
  }

  // Static header / footer buttons & keyboard shortcuts
  for (const b of document.querySelectorAll("#wiz-lang-seg [data-wiz-lang]")) {
    b.addEventListener("click", () => {
      uiLang = b.getAttribute("data-wiz-lang") === "en" ? "en" : "fr";
      render();
    });
  }
  document.getElementById("step-dots").addEventListener("click", (e) => {
    const dot = e.target.closest("[data-step-dot]");
    if (!dot || currentView !== "wizard") return;
    const s = Number(dot.getAttribute("data-step-dot"));
    if (s >= 1 && s <= 5 && s !== wizardStep) {
      wizardStep = s;
      bannerMsg = null;
      render();
    }
  });
  const sidebarBrandBtn = document.getElementById("sidebar-brand");
  if (sidebarBrandBtn) {
    sidebarBrandBtn.addEventListener("click", () => {
      currentView = "home";
      bannerMsg = null;
      render();
    });
  }
  const btnThemeLight = document.getElementById("btn-theme-light");
  if (btnThemeLight) {
    btnThemeLight.addEventListener("click", () => {
      applyTheme("light");
      callBridge("setTheme", { theme: "light" }).catch(() => {});
      render();
    });
  }
  const btnThemeDark = document.getElementById("btn-theme-dark");
  if (btnThemeDark) {
    btnThemeDark.addEventListener("click", () => {
      applyTheme("dark");
      callBridge("setTheme", { theme: "dark" }).catch(() => {});
      render();
    });
  }
  document.getElementById("btn-prev").addEventListener("click", () => {
    if (wizardStep > 1) {
      wizardStep -= 1;
      bannerMsg = null;
      render();
    }
  });
  document.getElementById("btn-next").addEventListener("click", async () => {
    if (wizardStep < 5) {
      wizardStep += 1;
      bannerMsg = null;
      render();
      return;
    }
    const nextBtn = document.getElementById("btn-next");
    nextBtn.disabled = true;
    isBusy = true;
    syncCatAnimation();
    const defaultModel = form.engine_mode === "api" ? formattedCloudModelId() : `ollama:${form.local_model}`;
    try {
      sysState = await callBridge("saveConfigAndStartServer", {
        onboarding_done: true,
        ui_lang: uiLang,
        theme: currentTheme,
        mascot: selectedMascot,
        engine_mode: form.engine_mode,
        default_model: defaultModel,
        api_provider: form.api_provider,
        api_base_url: (form.api_base_url || "").trim(),
        api_model: (form.api_model || "").trim(),
        source_lang: form.source_lang,
        target_lang: form.target_lang,
        vision_mode: form.vision_mode,
        api_key: apiKeyDraft.trim(),
      });
      apiKeyDraft = "";
      currentView = "home";
      settingsTab = "general";
      bannerMsg = sysState.server_running
        ? null
        : { ok: false, text: uiLang === "en" ? "Saved, but Python server failed to start (check Settings → General)." : "Enregistré, mais le serveur Python n'a pas démarré (vérifiez Réglages → Général)." };
      render();
    } catch (err) {
      bannerMsg = { ok: false, text: err.message };
      render();
    } finally {
      isBusy = false;
      nextBtn.disabled = false;
    }
  });
  window.addEventListener("pointermove", (e) => {
    if (studioCropDrag) {
      const { mode, startX, startY, orig, stageW, stageH, el } = studioCropDrag;
      const dx = (e.clientX - startX) / stageW;
      const dy = (e.clientY - startY) / stageH;
      const minSize = 0.08;
      let { x, y, w, h } = orig;
      if (mode === "move") {
        x = Math.max(0, Math.min(1 - w, orig.x + dx));
        y = Math.max(0, Math.min(1 - h, orig.y + dy));
      } else {
        if (mode.includes("w")) {
          const maxX = orig.x + orig.w - minSize;
          x = Math.max(0, Math.min(maxX, orig.x + dx));
          w = orig.x + orig.w - x;
        }
        if (mode.includes("e")) {
          w = Math.max(minSize, Math.min(1 - orig.x, orig.w + dx));
        }
        if (mode.includes("n")) {
          const maxY = orig.y + orig.h - minSize;
          y = Math.max(0, Math.min(maxY, orig.y + dy));
          h = orig.y + orig.h - y;
        }
        if (mode.includes("s")) {
          h = Math.max(minSize, Math.min(1 - orig.y, orig.h + dy));
        }
      }
      studio.cropRect = { x, y, w, h };
      if (el) {
        el.style.left = `${(x * 100).toFixed(2)}%`;
        el.style.top = `${(y * 100).toFixed(2)}%`;
        el.style.width = `${(w * 100).toFixed(2)}%`;
        el.style.height = `${(h * 100).toFixed(2)}%`;
      }
      return;
    }
    if (!studioDrag) return;
    const bubble = studio.bubbles.find((item) => item.id === studioDrag.id);
    if (!bubble || !studioDrag.el) return;
    const dx = (e.clientX - studioDrag.startX) / studioDrag.stageW;
    const dy = (e.clientY - studioDrag.startY) / studioDrag.stageH;
    if (!studioDrag.pushedUndo && (Math.abs(e.clientX - studioDrag.startX) > 1 || Math.abs(e.clientY - studioDrag.startY) > 1)) {
      pushStudioUndo(studioDrag.preSnapshot);
      studioDrag.pushedUndo = true;
    }
    if (studioDrag.mode === "move") {
      bubble.x = Math.max(0, Math.min(1 - bubble.w, studioDrag.origX + dx));
      bubble.y = Math.max(0, Math.min(1 - bubble.h, studioDrag.origY + dy));
      studioDrag.el.style.left = `${(bubble.x * 100).toFixed(3)}%`;
      studioDrag.el.style.top = `${(bubble.y * 100).toFixed(3)}%`;
    } else {
      bubble.w = Math.max(0.04, Math.min(1 - bubble.x, studioDrag.origW + dx));
      bubble.h = Math.max(0.03, Math.min(1 - bubble.y, studioDrag.origH + dy));
      studioDrag.el.style.width = `${(bubble.w * 100).toFixed(3)}%`;
      studioDrag.el.style.height = `${(bubble.h * 100).toFixed(3)}%`;
      fitStudioBubbleFont(studioDrag.el, bubble);
    }
  });
  window.addEventListener("pointerup", () => { studioDrag = null; studioCropDrag = null; });
  window.addEventListener("pointercancel", () => { studioDrag = null; studioCropDrag = null; });
  window.addEventListener("resize", () => {
    if (currentView === "test") {
      if (Math.abs(studio.zoom - 1.0) < 0.01) studio.fitBaseW = 0;
      requestAnimationFrame(() => applyStudioZoom());
    }
  });
  window.addEventListener("dragover", (e) => {
    e.preventDefault();
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    if (currentView !== "test") return;
    if (e.target && e.target.closest && e.target.closest("#studio-drop-pane")) return;
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type && file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = () => loadAndTranslateImage(reader.result, file.name, false);
      reader.readAsDataURL(file);
    }
  });
  window.addEventListener("paste", (e) => {
    if (currentView !== "test") return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const item of items) {
      if (item.type && item.type.startsWith("image/")) {
        const f = item.getAsFile();
        if (f) {
          e.preventDefault();
          const reader = new FileReader();
          reader.onload = () => loadAndTranslateImage(reader.result, "clipboard.png", false);
          reader.readAsDataURL(f);
          return;
        }
      }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.metaKey && e.key === ",") {
      e.preventDefault();
      currentView = "settings";
      settingsTab = "general";
      bannerMsg = null;
      render();
      return;
    }
    const tag = (e.target && e.target.tagName) || "";
    if (currentView === "test" && e.metaKey && e.key.toLowerCase() === "v") {
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      callBridge("readClipboardImage").then((r) => {
        if (r && r.found && r.data_url) {
          loadAndTranslateImage(r.data_url, r.filename || "clipboard.png", false);
        }
      }).catch(() => {});
      return;
    }
    if (currentView === "test" && e.key === " " && !studio.cropMode && studio.imageDataUrl) {
      if (!["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(tag)) {
        e.preventDefault();
        if (!spacePeekActive) {
          spacePeekActive = true;
          const stg = document.getElementById("studio-stage");
          if (stg) stg.classList.add("hide-bubbles");
        }
        return;
      }
    }
    if (currentView === "test" && e.metaKey && e.key.toLowerCase() === "z") {
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      if (e.shiftKey) redoStudio();
      else undoStudio();
      return;
    }
    if (currentView === "test" && e.metaKey && !studio.cropMode && studio.imageDataUrl) {
      if (e.key === "=" || e.key === "+") {
        e.preventDefault();
        setStudioZoom(studio.zoom + 0.25);
        return;
      }
      if (e.key === "-") {
        e.preventDefault();
        setStudioZoom(studio.zoom - 0.25);
        return;
      }
      if (e.key === "0") {
        e.preventDefault();
        setStudioZoom(1.0);
        return;
      }
    }
    if (currentView === "test" && e.key === "Escape") {
      if (studio.cropMode) {
        studio.cropMode = false;
        render();
        return;
      }
      if (studio.editMode && studio.selectedId !== null && tag !== "INPUT" && tag !== "TEXTAREA") {
        studio.selectedId = null;
        syncStageSelectionDom();
        refreshStudioInspector();
      }
      return;
    }
    if (currentView !== "wizard") return;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "Enter" && tag !== "BUTTON") {
      e.preventDefault();
      document.getElementById("btn-next").click();
    } else if (e.key === "Escape" && wizardStep > 1) {
      e.preventDefault();
      wizardStep -= 1;
      bannerMsg = null;
      render();
    }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === " " && spacePeekActive) {
      spacePeekActive = false;
      const stg = document.getElementById("studio-stage");
      if (stg) stg.classList.toggle("hide-bubbles", studio.showOriginal);
    }
  });
  window.addEventListener("blur", () => {
    if (spacePeekActive) {
      spacePeekActive = false;
      const stg = document.getElementById("studio-stage");
      if (stg) stg.classList.toggle("hide-bubbles", studio.showOriginal);
    }
  });

  // Init
  callBridge("getState").then((s) => {
    sysState = s;
    const cfg = s.config || {};
    uiLang = cfg.ui_lang === "en" ? "en" : "fr";
    applyTheme(cfg.theme || "system");
    selectedMascot = ["mochi", "kuro", "sakura"].includes(cfg.mascot) ? cfg.mascot : "mochi";
    applyMascotTheme(selectedMascot);
    form.engine_mode = cfg.engine_mode || "local";
    form.api_provider = CLOUD_PROVIDERS[cfg.api_provider] ? cfg.api_provider : "gemini";
    form.api_base_url = (cfg.api_base_url || "").trim();
    customBaseUrlOpen = form.api_provider === "custom" || Boolean(form.api_base_url);
    if (!cfg.onboarding_done && s.recommended_model) {
      form.local_model = s.recommended_model;
    } else if (cfg.default_model && cfg.default_model.startsWith("ollama:")) {
      form.local_model = cfg.default_model.slice("ollama:".length);
    } else if (s.recommended_model) {
      form.local_model = s.recommended_model;
    }
    const parsedCloud = parseDefaultCloudModel(cfg.default_model);
    if (cfg.api_model) {
      form.api_model = cfg.api_model;
    } else if (parsedCloud) {
      form.api_provider = parsedCloud.provider;
      form.api_model = parsedCloud.model;
    } else {
      const firstPreset = getProviderInfo(form.api_provider).models[0];
      form.api_model = firstPreset ? firstPreset.v : "";
    }
    form.source_lang = cfg.source_lang || "en";
    form.target_lang = cfg.target_lang || "fr";
    form.vision_mode = cfg.vision_mode || "auto";
    currentView = cfg.onboarding_done ? "home" : "wizard";
    wizardStep = 1;
    settingsTab = "general";
    render();
  });
})();
</script>
</body>
</html>
